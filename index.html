<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>星际穿梭 · 巨行星低空</title>
<style>
  :root{ --cyan:#3ee8ff; --pink:#ff3d8b; --mint:#5cffc0; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8f6ff;user-select:none}
  #game{position:fixed;inset:0}
  #game canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;padding:22px 26px;
       display:flex;justify-content:space-between;align-items:flex-start;
       font-variant-numeric:tabular-nums; z-index: 5;}
  .hud .label{font-size:11px;letter-spacing:4px;opacity:.45;margin-bottom:2px}
  .hud .score{font-size:36px;font-weight:800;letter-spacing:2px;color:var(--cyan);
              text-shadow:0 0 22px rgba(62,232,255,.75)}
  .hud .right{text-align:right}
  .hud .right .val{font-size:18px;font-weight:700;color:#8fe3ff;opacity:.85}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,rgba(10,30,60,.55),rgba(2,3,10,.93));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .35s ease; z-index: 10;}
  .overlay.hidden{opacity:0;pointer-events:none}
  .card{text-align:center;padding:40px 46px;max-width:480px}

  .title{font-size:46px;font-weight:900;letter-spacing:10px;
    background:linear-gradient(90deg,#3ee8ff,#5cffc0,#ff3d8b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(62,232,255,.45))}
  .subtitle{font-size:11px;letter-spacing:9px;opacity:.45;margin-top:8px;text-transform:uppercase}

  .tips{margin:30px 0 34px;font-size:14px;line-height:2.1;opacity:.75}
  .tips b{color:var(--cyan);font-weight:600}
  .key{display:inline-block;padding:1px 9px;border:1px solid rgba(255,255,255,.22);
       border-radius:5px;font-size:12px;margin:0 2px;opacity:.9}

  .btn-group{display:flex;gap:15px;justify-content:center;margin-top:10px;}
  
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;
    padding:16px 40px;font-size:16px;font-weight:800;letter-spacing:3px;
    color:#001018;background:linear-gradient(135deg,#5cffc0,#3ee8ff);
    box-shadow:0 0 36px rgba(62,232,255,.5);
    transition:transform .18s,box-shadow .18s,background .18s;font-family:inherit}
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 52px rgba(62,232,255,.85)}
  .btn:active{transform:scale(.96)}

  .btn-secondary{background:transparent;border:1px solid rgba(62,232,255,.35);color:#8fe3ff;box-shadow:none;}
  .btn-secondary:hover{background:rgba(62,232,255,.1);box-shadow:0 0 25px rgba(62,232,255,.2);}

  .bigscore{font-size:68px;font-weight:900;color:#fff;line-height:1;margin:16px 0 8px;
            text-shadow:0 0 44px rgba(62,232,255,.7)}
  .best{font-size:13px;letter-spacing:3px;opacity:.55;margin-bottom:30px}
  #flash{position:fixed;inset:0;background:#ff2d6f;opacity:0;pointer-events:none;
         transition:opacity .12s ease; z-index: 99;}
</style>
</head>
<body>

<div id="game"></div>
<div id="flash"></div>

<div class="hud" id="hud" style="display:none">
  <div>
    <div class="label">SCORE</div>
    <div class="score" id="score">0</div>
  </div>
  <div class="right">
    <div class="label">BEST</div>
    <div class="val" id="bestHud">0</div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <div class="title">星际穿梭</div>
    <div class="subtitle">Giant Planet Low Orbit</div>
    <div class="tips">
      移动<b>鼠标</b> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span class="key">↑↓←→</span> 操控飞船<br>
      躲避<b style="color:#ff3d8b">太空垃圾</b>，收集<b style="color:#5cffc0">绿色能量球</b><br>
      感受赛道弯曲，跟随流星轨迹
    </div>
    <button class="btn" id="startBtn">开始飞行</button>
  </div>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="card">
    <div class="subtitle">飞行结束</div>
    <div class="bigscore" id="finalScore">0</div>
    <div class="best" id="finalBest">最高分 0</div>
    <div class="btn-group">
      <button class="btn" id="retryBtn">再来一次</button>
      <button class="btn btn-secondary" id="exitBtn">退出</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ═══════════ 工具 ═══════════ */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const damp  = (k,dt)=>1-Math.exp(-k*dt);
const rnd   = (a,b)=>a+Math.random()*(b-a);

/* ═══════════ DOM ═══════════ */
const container   = document.getElementById('game');
const scoreEl     = document.getElementById('score');
const bestEl      = document.getElementById('bestHud');
const hudEl       = document.getElementById('hud');
const startScreen = document.getElementById('startScreen');
const overScreen  = document.getElementById('overScreen');
const finalScoreEl= document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const flashEl     = document.getElementById('flash');

/* ═══════════ 渲染器 / 场景 ═══════════ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050a);
scene.fog = new THREE.FogExp2(0x03050a, 0.002);

const camera = new THREE.PerspectiveCamera(80, innerWidth/innerHeight, 0.1, 8000);
camera.position.set(0, 2.6, 8.6);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

/* ═══════════ 灯光 ═══════════ */
scene.add(new THREE.AmbientLight(0x223344, 1.5)); 
const keyLight = new THREE.DirectionalLight(0xbfe8ff, 2.0);
keyLight.position.set(10, 20, 5); 
scene.add(keyLight);

/* ═══════════ 音效与音乐引擎 ═══════════ */
const Sound = {
  ctx:null, master:null, bgmGain:null, sfxGain:null, delayNode:null, ready:false,
  bgmTimer:null, currentChord:0, noteIndex:0,
  
  init(){
    if (this.ctx){ 
      if(this.ctx.state==='suspended') this.ctx.resume(); 
      return; 
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    
    this.master = this.ctx.createGain(); 
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.8;
    this.sfxGain.connect(this.master);

    // 空间延迟效果器
    this.delayNode = this.ctx.createDelay();
    this.delayNode.delayTime.value = 0.45;
    const delayFeedback = this.ctx.createGain();
    delayFeedback.gain.value = 0.35;
    this.delayNode.connect(delayFeedback);
    delayFeedback.connect(this.delayNode);
    this.delayNode.connect(this.master);

    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = 0.25;
    this.bgmGain.connect(this.master);

    this.ready = true;
    this.startBGM();
  },

  playTone(freq, type, time, dur, vol, pan = 0) {
    const o = this.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, time);
    
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);

    const p = this.ctx.createStereoPanner();
    p.pan.setValueAtTime(pan, time);

    o.connect(g);
    g.connect(p);
    p.connect(this.bgmGain);
    
    // 部分音符加入延迟
    if (Math.random() > 0.5) p.connect(this.delayNode);

    o.start(time);
    o.stop(time + dur + 0.1);
  },

  startBGM(){
    if (!this.ready || this.bgmTimer) return;
    
    // 和弦进行 (A minor 氛围)
    const chords = [
      [110.00, 130.81, 164.81, 246.94], // Am9
      [87.31, 130.81, 174.61, 220.00],  // Fmaj7
      [130.81, 164.81, 196.00, 246.94], // Cmaj7
      [98.00, 146.83, 196.00, 246.94]   // G6
    ];

    const arpPattern = [0, 2, 1, 3, 2, 1, 0, 2]; // 琶音序列
    let beat = 0;

    const scheduleNext = () => {
      const t = this.ctx.currentTime;
      const chord = chords[this.currentChord];
      
      // 铺底 Pad 长音 (每 4 拍)
      if (beat % 8 === 0) {
        chord.forEach((freq, i) => {
          this.playTone(freq / 2, 'sine', t, 4.0, 0.1, (i%2===0? -0.5 : 0.5));
        });
      }

      // 闪烁琶音
      const noteFreq = chord[arpPattern[this.noteIndex % arpPattern.length]];
      this.playTone(noteFreq, 'triangle', t, 0.6, 0.08, Math.sin(beat * 0.5));

      this.noteIndex++;
      if (beat % 8 === 7) this.currentChord = (this.currentChord + 1) % chords.length;
      beat++;

      this.bgmTimer = setTimeout(scheduleNext, 300); // 约 200 BPM
    };
    
    scheduleNext();
  },

  fadeBGM(targetVol, duration){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    this.bgmGain.gain.cancelScheduledValues(t);
    this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, t);
    this.bgmGain.gain.linearRampToValueAtTime(targetVol, t + duration);
  },

  pickup(){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1760, t+0.1);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t+0.2);
  },

  explode(){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(100, t); o.frequency.exponentialRampToValueAtTime(20, t+0.5);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.6);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t+0.6);
  }
};

/* ═══════════ 赛道弯曲数学计算 ═══════════ */
function getCurveOffset(z) {
    const totalZ = state.traveled - z; 
    const A1 = 80, F1 = 0.0012;
    const A2 = 40, F2 = 0.0035;
    const x = Math.sin(totalZ * F1) * A1 + Math.sin(totalZ * F2) * A2;
    
    const B1 = 60, G1 = 0.001;
    const B2 = 25, G2 = 0.0025;
    const y = Math.cos(totalZ * G1) * B1 + Math.cos(totalZ * G2) * B2;
    
    return new THREE.Vector3(x, y, 0);
}

function getTangent(z) {
    const totalZ = state.traveled - z;
    const dx = Math.cos(totalZ * 0.0012) * 80 * 0.0012 + Math.cos(totalZ * 0.0035) * 40 * 0.0035;
    const dy = -Math.sin(totalZ * 0.001) * 60 * 0.001 - Math.sin(totalZ * 0.0025) * 25 * 0.0025;
    return new THREE.Vector3(dx, dy, -1).normalize();
}

/* ═══════════ 飞船 ═══════════ */
function buildShip(){
  const g = new THREE.Group();
  const bodyGeo = new THREE.ConeGeometry(0.46, 1.9, 4, 1);
  bodyGeo.rotateX(-Math.PI/2);
  bodyGeo.rotateZ(Math.PI/4);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({
    color:0x9fe9ff, emissive:0x1b7fa8, emissiveIntensity:0.9,
    metalness:1, roughness:0.18, flatShading:true
  }));
  g.add(body);

  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 10),
    new THREE.MeshStandardMaterial({
      color:0x06202e, emissive:0x00e5ff, emissiveIntensity:1.8,
      metalness:1, roughness:0.05
    }));
  cockpit.position.set(0, 0.14, -0.18);
  cockpit.scale.set(1, 0.7, 1.6);
  g.add(cockpit);

  const wingMat = new THREE.MeshStandardMaterial({
    color:0x2f8fc4, emissive:0x0a3a55, metalness:1, roughness:0.3, flatShading:true
  });
  const wings = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.09, 0.62), wingMat);
  wings.position.set(0, -0.06, 0.44);
  g.add(wings);

  const tipGeo = new THREE.BoxGeometry(0.13, 0.32, 0.5);
  for (const s of [-1, 1]){
    const t = new THREE.Mesh(tipGeo, wingMat);
    t.position.set(s * 0.87, 0.09, 0.44);
    g.add(t);
  }

  const engine = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10),
    new THREE.MeshBasicMaterial({color:0x7dfbff}));
  engine.position.set(0, 0, 0.92);
  engine.scale.set(1, 1, 1.7);
  g.add(engine);

  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12),
    new THREE.MeshBasicMaterial({
      color:0x2fd8ff, transparent:true, opacity:0.22,
      depthWrite:false, blending:THREE.AdditiveBlending
    }));
  glow.position.set(0, 0, 1.15);
  glow.scale.set(1, 1, 2.4);
  g.add(glow);

  const lamp = new THREE.PointLight(0x33e8ff, 34, 26, 2);
  lamp.position.set(0, 0, 1.6);
  g.add(lamp);

  return g;
}

const shipPivot = new THREE.Group();
scene.add(shipPivot);

const ship = buildShip();
shipPivot.add(ship);

/* ═══════════════════════════════════════════
   超巨大行星背景
   ═══════════════════════════════════════════ */
const planetUniforms = {
  time: { value: 0 },
  lightDir: { value: new THREE.Vector3(0.4, 0.8, 0.2).normalize() }
};

const planetVert = `
  varying vec3 vPos;
  varying vec3 vNormal;
  varying vec3 vViewPosition;
  void main() {
    vPos = position;
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vViewPosition = -mvPosition.xyz;
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const planetFrag = `
  uniform float time;
  uniform vec3 lightDir;
  varying vec3 vPos;
  varying vec3 vNormal;
  varying vec3 vViewPosition;

  float hash(vec3 p) {
      p = fract(p * 0.3183099 + 0.1);
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float noise(vec3 x) {
      vec3 i = floor(x);
      vec3 f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                     mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                     mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p) {
      float f = 0.0;
      float amp = 0.5;
      for(int i = 0; i < 5; i++) {
          f += amp * noise(p);
          p *= 2.0;
          amp *= 0.5;
      }
      return f;
  }
  float ridged(vec3 p) {
      float n = noise(p);
      n = abs(n * 2.0 - 1.0);
      return 1.0 - n;
  }

  void main() {
      vec3 p = normalize(vPos) * 3.5; 
      
      float h = fbm(p);
      h += 0.35 * ridged(p * 2.0 + vec3(0.0, time * 0.01, 0.0));
      
      float eps = 0.02;
      float hx = fbm(p + vec3(eps, 0.0, 0.0));
      float hy = fbm(p + vec3(0.0, eps, 0.0));
      vec3 tangent = normalize(cross(vNormal, vec3(0.0, 1.0, 0.0)));
      vec3 bitangent = normalize(cross(vNormal, tangent));
      vec3 normal = normalize(vNormal - tangent * (hx - h) / eps * 0.6 - bitangent * (hy - h) / eps * 0.6);

      vec3 colOcean = vec3(0.02, 0.08, 0.15);
      vec3 colLand = vec3(0.12, 0.24, 0.20);
      vec3 colMountain = vec3(0.45, 0.40, 0.35);
      vec3 colCloud = vec3(0.85, 0.92, 1.0);
      
      vec3 baseColor = mix(colOcean, colLand, smoothstep(0.3, 0.45, h));
      baseColor = mix(baseColor, colMountain, smoothstep(0.55, 0.75, h));
      
      float cloudNoise = fbm(p * 1.2 + vec3(time * 0.015, 0.0, 0.0));
      float cloud = smoothstep(0.45, 0.65, cloudNoise);
      baseColor = mix(baseColor, colCloud, cloud * 0.8);
      
      vec3 viewDir = normalize(vViewPosition);
      float diff = max(dot(normal, lightDir), 0.0);
      float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 4.0);
      vec3 atmosColor = vec3(0.2, 0.6, 1.0);
      
      vec3 finalColor = baseColor * (0.1 + diff * 0.9);
      finalColor += atmosColor * fresnel * 1.5;
      
      gl_FragColor = vec4(finalColor, 1.0);
  }
`;

const planetRadius = 4000;
const planetGeo = new THREE.SphereGeometry(planetRadius, 256, 128);
const planetMat = new THREE.ShaderMaterial({
  vertexShader: planetVert,
  fragmentShader: planetFrag,
  uniforms: planetUniforms
});
const giantPlanet = new THREE.Mesh(planetGeo, planetMat);
giantPlanet.position.set(0, -3600, -2000); 
scene.add(giantPlanet);

/* ═══════════════════════════════════════════
   星云与星空
   ═══════════════════════════════════════════ */
const STAR_COUNT = 600, STAR_RANGE = 400;
const starPos = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++){
  const a = Math.random() * Math.PI * 2;
  const rad = 10 + Math.random() * 200;
  starPos[i*3]   = Math.cos(a) * rad;
  starPos[i*3+1] = Math.sin(a) * rad + 50; 
  starPos[i*3+2] = -Math.random() * STAR_RANGE + 20;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color:0x88aaff, size:0.5, sizeAttenuation:true,
  transparent:true, opacity:0.25, depthWrite:false
}));
scene.add(stars);

function createNebulaTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 1024, 1024);
  for(let i=0; i<15; i++){
    const x = Math.random()*1024;
    const y = Math.random()*1024;
    const r = 200 + Math.random()*400;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    const hue = 200 + Math.random()*100;
    grad.addColorStop(0, `hsla(${hue}, 80%, 50%, 0.1)`);
    grad.addColorStop(1, `hsla(${hue}, 80%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
const nebulaMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(8000, 4000),
  new THREE.MeshBasicMaterial({
    map: createNebulaTexture(), transparent: true, opacity: 0.4,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: false
  })
);
nebulaMesh.position.set(0, 0, -3000);
scene.add(nebulaMesh);

/* ═══════════════════════════════════════════
   动态流星轨迹
   ═══════════════════════════════════════════ */
const METEOR_COUNT = 90;
const meteors = [];

const meteorGeo = new THREE.CylinderGeometry(0.04, 0.08, 6, 6);
meteorGeo.rotateX(Math.PI / 2); 
const meteorMat = new THREE.MeshBasicMaterial({
  color: 0x3ee8ff,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

for (let i = 0; i < METEOR_COUNT; i++) {
  const mesh = new THREE.Mesh(meteorGeo, meteorMat);
  scene.add(mesh);
  
  const side = Math.random() > 0.5 ? 1 : -1;
  const localX = side * rnd(3.5, 5.5);
  const localY = rnd(-1, 1);
  
  meteors.push({
    mesh, localX, localY,
    z: -Math.random() * 350 - 20, 
    speedScale: rnd(0.95, 1.05) 
  });
}

function updateMeteors(dt, dz) {
  for (const m of meteors) {
    m.z += dz * m.speedScale;
    
    if (m.z > 16) {
      m.z -= 380;
      const side = Math.random() > 0.5 ? 1 : -1;
      m.localX = side * rnd(3.5, 5.5);
      m.localY = rnd(-1, 1);
    }
    
    const z = m.z;
    const center = getCurveOffset(z);
    const T = getTangent(z);
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(T, up).normalize();
    const realUp = new THREE.Vector3().crossVectors(right, T).normalize();
    
    const worldPos = new THREE.Vector3(center.x, center.y, z)
        .add(right.clone().multiplyScalar(m.localX))
        .add(realUp.clone().multiplyScalar(m.localY));
    
    m.mesh.position.copy(worldPos);
    m.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), T);
  }
}

/* ═══════════ 障碍物与能量球工厂 ═══════════ */
const DEBRIS_GEOS = [];
for (let i = 0; i < 16; i++){
  const r = Math.random();
  if (r < 0.40) DEBRIS_GEOS.push(new THREE.BoxGeometry(rnd(0.40,1.20), rnd(0.10,0.45), rnd(0.40,1.10)));
  else if (r < 0.65) DEBRIS_GEOS.push(new THREE.CylinderGeometry(rnd(0.10,0.30), rnd(0.10,0.30), rnd(0.45,1.30), 6));
  else if (r < 0.85) DEBRIS_GEOS.push(new THREE.TorusGeometry(rnd(0.28,0.55), rnd(0.05,0.12), 5, 9));
  else DEBRIS_GEOS.push(new THREE.IcosahedronGeometry(rnd(0.24,0.50), 0));
}
const DEBRIS_MATS = [];
for (let i = 0; i < 7; i++){
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.06 + Math.random()*0.12, 0.15 + Math.random()*0.25, 0.2 + Math.random()*0.3),
    metalness: 0.92, roughness: 0.55, flatShading: true
  });
  if (i === 6){ m.emissive = new THREE.Color(0xff3322); m.emissiveIntensity = 1.0; }
  DEBRIS_MATS.push(m);
}
const DEBRIS_SPARK = new THREE.MeshBasicMaterial({ color:0xffcc66 });

function makeDebris(){
  const grp = new THREE.Group();
  const n = 3 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++){
    const geo = DEBRIS_GEOS[(Math.random()*DEBRIS_GEOS.length)|0];
    const mat = DEBRIS_MATS[(Math.random()*DEBRIS_MATS.length)|0];
    const m = new THREE.Mesh(geo, mat);
    m.position.set(rnd(-0.55,0.55), rnd(-0.55,0.55), rnd(-0.55,0.55));
    m.rotation.set(rnd(0,6.28), rnd(0,6.28), rnd(0,6.28));
    m.scale.setScalar(rnd(0.75, 1.15));
    grp.add(m);
  }
  if (Math.random() < 0.45){
    const spark = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), DEBRIS_SPARK);
    spark.position.set(rnd(-0.4,0.4), rnd(-0.4,0.4), rnd(-0.4,0.4));
    grp.add(spark);
  }
  grp.scale.setScalar(rnd(0.6, 1.05));
  return grp;
}

const orbCoreGeo = new THREE.IcosahedronGeometry(0.34, 1);
const orbCoreMat = new THREE.MeshBasicMaterial({color:0x8dffd6});
const orbGlowGeo = new THREE.SphereGeometry(0.66, 16, 12);
const orbGlowMat = new THREE.MeshBasicMaterial({
  color:0x5cffc0, transparent:true, opacity:0.22,
  depthWrite:false, blending:THREE.AdditiveBlending
});

/* ═══════════ 游戏逻辑 ═══════════ */
const LIMIT_X = 4.7, LIMIT_Y = 3.3, PLACE_R = 5.0;
const obstacles = [];
const orbs = [];

let scrollSpeed = 0;
let pointerActive = false;
let pointerTargetX = 0, pointerTargetY = 0;
let prevShipX = 0, prevShipY = 0;

const state = {
  mode: 'ready',
  speed: 38,
  baseSpeed: 38,
  maxSpeed: 108,
  elapsed: 0,
  traveled: 0,
  nextSpawn: 0,
  score: 0,
  shipX: 0,
  shipY: 0,
  best: +(localStorage.getItem('starrunner_best') || 0)
};

function spawnObstacle(){
  const grp = makeDebris();
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * PLACE_R;
  
  const localX = Math.cos(a)*r;
  const localY = Math.sin(a)*r;
  const z = -135 - Math.random()*25;
  
  const center = getCurveOffset(z);
  grp.position.set(center.x + localX, center.y + localY, z);
  grp.rotation.set(rnd(0,6.28), rnd(0,6.28), rnd(0,6.28));
  scene.add(grp);

  const box = new THREE.Box3().setFromObject(grp);
  const sphere = box.getBoundingSphere(new THREE.Sphere());

  obstacles.push({
    mesh: grp,
    localX: localX,
    localY: localY,
    radius: Math.max(0.62, sphere.radius * 0.82),
    spin: { x: rnd(-0.9,0.9), y: rnd(-0.9,0.9), z: rnd(-0.6,0.6) }
  });
}

function spawnOrb(){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(orbGlowGeo, orbGlowMat));
  const core = new THREE.Mesh(orbCoreGeo, orbCoreMat);
  g.add(core);
  
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * 4.2;
  const localX = Math.cos(a)*r;
  const localY = Math.sin(a)*r;
  const z = -130 - Math.random()*22;

  const center = getCurveOffset(z);
  g.position.set(center.x + localX, center.y + localY, z);
  
  scene.add(g);
  orbs.push({ mesh:g, core, localX, localY });
}

function spawnWave(){
  const t = Math.min(1, state.elapsed / 80);
  const count = 2 + Math.round(Math.random() * (1 + t * 3));
  for (let i = 0; i < count; i++) spawnObstacle();
  if (Math.random() < 0.36) spawnOrb();
}

function spawnLogic(){
  if (state.traveled < state.nextSpawn) return;
  const t = Math.min(1, state.elapsed / 80);
  const interval = 0.95 - 0.42 * t;
  state.nextSpawn = state.traveled + state.speed * interval;
  spawnWave();
}

const keys = new Set();

function updateShip(dt){
  let dirX = 0, dirY = 0;
  if (keys.has('a') || keys.has('arrowleft'))  dirX -= 1;
  if (keys.has('d') || keys.has('arrowright')) dirX += 1;
  if (keys.has('w') || keys.has('arrowup'))    dirY += 1;
  if (keys.has('s') || keys.has('arrowdown'))  dirY -= 1;

  if (dirX || dirY){
    state.shipX += dirX * 15 * dt;
    state.shipY += dirY * 15 * dt;
    pointerTargetX = state.shipX;
    pointerTargetY = state.shipY;
  } else if (pointerActive){
    const k = damp(17, dt);
    state.shipX += (pointerTargetX - state.shipX) * k;
    state.shipY += (pointerTargetY - state.shipY) * k;
  }

  state.shipX = clamp(state.shipX, -LIMIT_X, LIMIT_X);
  state.shipY = clamp(state.shipY, -LIMIT_Y, LIMIT_Y);

  const vx = (state.shipX - prevShipX) / Math.max(dt, 1e-4);
  const vy = (state.shipY - prevShipY) / Math.max(dt, 1e-4);
  const k = damp(11, dt);
  
  ship.rotation.z += (-vx * 0.035 - ship.rotation.z) * k;
  ship.rotation.x += ( vy * 0.030 - ship.rotation.x) * k;
  ship.rotation.y += (0 - ship.rotation.y) * k;

  prevShipX = state.shipX;
  prevShipY = state.shipY;
}

function updateWorld(dt){
  const dz = scrollSpeed * dt;
  const time = performance.now() * 0.001;

  planetUniforms.time.value = time;

  const sp = starGeo.attributes.position;
  for (let i = 0; i < STAR_COUNT; i++){
    let z = sp.array[i*3+2] + dz * 0.8;
    if (z > 20) z -= STAR_RANGE;
    sp.array[i*3+2] = z;
  }
  sp.needsUpdate = true;

  updateMeteors(dt, dz);

  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    const prevZ = o.mesh.position.z;
    o.mesh.position.z += dz;
    
    const z = o.mesh.position.z;
    const center = getCurveOffset(z);
    const T = getTangent(z);
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(T, up).normalize();
    const realUp = new THREE.Vector3().crossVectors(right, T).normalize();
    
    o.mesh.position.copy(new THREE.Vector3(center.x, center.y, z)
        .add(right.clone().multiplyScalar(o.localX))
        .add(realUp.clone().multiplyScalar(o.localY)));

    o.mesh.rotation.x += o.spin.x * dt;
    o.mesh.rotation.y += o.spin.y * dt;
    o.mesh.rotation.z += o.spin.z * dt;

    if (state.mode === 'playing' && prevZ < 0 && o.mesh.position.z >= 0){
      const dx = o.localX - state.shipX;
      const dy = o.localY - state.shipY;
      if (Math.hypot(dx, dy) < o.radius + 0.5){ crash(); }
    }
    
    if (o.mesh.position.z > 16){
      scene.remove(o.mesh);
      obstacles.splice(i, 1);
    }
  }

  for (let i = orbs.length - 1; i >= 0; i--){
    const o = orbs[i];
    const prevZ = o.mesh.position.z;
    o.mesh.position.z += dz;
    
    const z = o.mesh.position.z;
    const center = getCurveOffset(z);
    const T = getTangent(z);
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(T, up).normalize();
    const realUp = new THREE.Vector3().crossVectors(right, T).normalize();
    
    o.mesh.position.copy(new THREE.Vector3(center.x, center.y, z)
        .add(right.clone().multiplyScalar(o.localX))
        .add(realUp.clone().multiplyScalar(o.localY)));

    o.core.rotation.x += 2.2 * dt;
    o.core.rotation.y += 3.0 * dt;

    if (state.mode === 'playing' && prevZ < 0 && o.mesh.position.z >= 0){
      const dx = o.localX - state.shipX;
      const dy = o.localY - state.shipY;
      if (Math.hypot(dx, dy) < 1.35){
        state.score += 50;
        Sound.pickup();
        scene.remove(o.mesh);
        orbs.splice(i, 1);
        continue;
      }
    }
    
    if (o.mesh.position.z > 16){
      scene.remove(o.mesh);
      orbs.splice(i, 1);
    }
  }
}

function updateCamera(dt){
  const offset0 = getCurveOffset(0);
  const T = getTangent(0);
  const up = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(T, up).normalize();
  const realUp = new THREE.Vector3().crossVectors(right, T).normalize();

  const shipWorld = new THREE.Vector3(offset0.x, offset0.y, 0)
      .add(right.clone().multiplyScalar(state.shipX))
      .add(realUp.clone().multiplyScalar(state.shipY));

  shipPivot.position.copy(shipWorld);
  shipPivot.up.copy(realUp);
  shipPivot.lookAt(shipWorld.clone().add(T)); 

  const camOffset = T.clone().multiplyScalar(-14); 
  const camUpOffset = realUp.clone().multiplyScalar(4.0);
  
  const desiredCamPos = new THREE.Vector3(offset0.x, offset0.y, 0).add(camOffset).add(camUpOffset);
  const camTarget = new THREE.Vector3(offset0.x, offset0.y, 0).add(T.clone().multiplyScalar(30));

  camera.position.copy(desiredCamPos);
  camera.up.copy(realUp);
  camera.lookAt(camTarget);
}

/* ═══════════ 爆炸粒子 ═══════════ */
const explosion = { points:null, vels:[], life:0, maxLife:1.3 };
function createExplosion(pos){
  const N = 110;
  const positions = new Float32Array(N * 3);
  const vels = [];
  for (let i = 0; i < N; i++){
    positions[i*3]   = pos.x;
    positions[i*3+1] = pos.y;
    positions[i*3+2] = pos.z;
    const v = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5)
      .normalize().multiplyScalar(3 + Math.random()*15);
    vels.push(v);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    color:0xffb04d, size:0.55, transparent:true, opacity:1,
    depthWrite:false, blending:THREE.AdditiveBlending
  }));
  scene.add(pts);
  explosion.points = pts;
  explosion.vels = vels;
  explosion.life = 1.3;
  explosion.maxLife = 1.3;
}
function updateParticles(dt){
  if (!explosion.points) return;
  explosion.life -= dt;
  if (explosion.life <= 0){
    scene.remove(explosion.points);
    explosion.points.geometry.dispose();
    explosion.points.material.dispose();
    explosion.points = null;
    return;
  }
  const pos = explosion.points.geometry.attributes.position;
  const drag = 1 - 2.2 * dt;
  for (let i = 0; i < explosion.vels.length; i++){
    const v = explosion.vels[i];
    pos.array[i*3]   += v.x * dt;
    pos.array[i*3+1] += v.y * dt;
    pos.array[i*3+2] += v.z * dt;
    v.multiplyScalar(drag);
  }
  pos.needsUpdate = true;
  explosion.points.material.opacity = Math.max(0, explosion.life / explosion.maxLife);
}

/* ═══════════ 游戏流程 ═══════════ */
function resetScene(){
  for (const o of obstacles) scene.remove(o.mesh);
  obstacles.length = 0;
  for (const o of orbs) scene.remove(o.mesh);
  orbs.length = 0;

  shipPivot.visible = true;
  shipPivot.position.set(0, 0, 0);
  shipPivot.rotation.set(0, 0, 0);
  ship.rotation.set(0, 0, 0);
  
  state.shipX = 0;
  state.shipY = 0;
  prevShipX = 0; prevShipY = 0;
  pointerTargetX = 0; pointerTargetY = 0;
  pointerActive = false;
}

function startGame(){
  Sound.init();
  Sound.fadeBGM(0.25, 1.0); // 恢复音量

  state.mode = 'playing';
  state.elapsed = 0;
  state.speed = state.baseSpeed;
  state.traveled = 0;
  state.nextSpawn = 45;
  state.score = 0;

  resetScene();

  scoreEl.textContent = '0';
  bestEl.textContent = state.best;
  hudEl.style.display = 'flex';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
}

function exitToMenu(){
  state.mode = 'ready';
  resetScene();
  overScreen.classList.add('hidden');
  hudEl.style.display = 'none';
  startScreen.classList.remove('hidden');
}

function crash(){
  if (state.mode !== 'playing') return;
  state.mode = 'over';
  shipPivot.visible = false;
  
  // 音乐淡出
  Sound.fadeBGM(0.05, 1.5);

  createExplosion(shipPivot.position);
  Sound.explode();

  flashEl.style.opacity = '0.9';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 90);

  const finalScore = Math.floor(state.score);
  if (finalScore > state.best){
    state.best = finalScore;
    localStorage.setItem('starrunner_best', String(state.best));
  }

  setTimeout(() => {
    finalScoreEl.textContent = finalScore;
    finalBestEl.textContent = '最高分 ' + state.best;
    overScreen.classList.remove('hidden');
    hudEl.style.display = 'none';
  }, 950);
}

/* ═══════════ 主循环 ═══════════ */
const clock = new THREE.Clock();

function update(dt){
  const time = performance.now() * 0.001;

  if (state.mode === 'playing'){
    state.elapsed += dt;
    const t = 1 - Math.exp(-state.elapsed / 45);
    state.speed = state.baseSpeed + (state.maxSpeed - state.baseSpeed) * t;
    state.traveled += state.speed * dt;
    scrollSpeed = state.speed;

    updateShip(dt);
    spawnLogic();

    state.score += state.speed * dt * 0.35;
    scoreEl.textContent = Math.floor(state.score);

  } else if (state.mode === 'ready'){
    scrollSpeed = 22;
    const offset0 = getCurveOffset(0);
    shipPivot.position.set(offset0.x, offset0.y, 0);
    ship.position.y = Math.sin(time * 1.5) * 0.22;
    ship.rotation.y = Math.sin(time * 0.6) * 0.25;
    ship.rotation.z = Math.sin(time * 0.9) * 0.06;
  } else {
    scrollSpeed *= Math.exp(-4 * dt);
    if (scrollSpeed < 0.4) scrollSpeed = 0;
  }

  updateWorld(dt);
  updateParticles(dt);
  
  if (state.mode !== 'over') {
      updateCamera(dt);
  } else {
      camera.position.z += dt * 2;
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

/* ═══════════ 输入 & 自适应 ═══════════ */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys.add(k);
  if (k === ' ' && state.mode !== 'playing') startGame();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

addEventListener('mousemove', e => {
  if (state.mode !== 'playing') return;
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -((e.clientY / innerHeight) * 2 - 1);
  pointerTargetX = nx * LIMIT_X;
  pointerTargetY = ny * LIMIT_Y;
  pointerActive = true;
});

let touchId = null, lastTX = 0, lastTY = 0;
addEventListener('touchstart', e => {
  if (state.mode !== 'playing') return;
  const t = e.changedTouches[0];
  touchId = t.identifier;
  lastTX = t.clientX; lastTY = t.clientY;
}, { passive:true });
addEventListener('touchmove', e => {
  if (state.mode !== 'playing' || touchId === null) return;
  for (const t of e.changedTouches){
    if (t.identifier !== touchId) continue;
    const dx = t.clientX - lastTX;
    const dy = t.clientY - lastTY;
    lastTX = t.clientX; lastTY = t.clientY;
    pointerTargetX = clamp(pointerTargetX + dx * 0.045, -LIMIT_X, LIMIT_X);
    pointerTargetY = clamp(pointerTargetY - dy * 0.045, -LIMIT_Y, LIMIT_Y);
    pointerActive = true;
  }
  e.preventDefault();
}, { passive:false });
addEventListener('touchend', e => {
  for (const t of e.changedTouches){
    if (t.identifier === touchId) touchId = null;
  }
}, { passive:true });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('exitBtn').addEventListener('click', exitToMenu);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

bestEl.textContent = state.best;
animate();
</script>
