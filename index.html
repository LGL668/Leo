<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DeepSeek 深度思考助手</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AI助手">

<style>
  :root{ 
    --bg: linear-gradient(135deg, #f0f4ff 0%, #ffeef8 100%);
    --text: #333333; 
    --pink: #ff6b9e; 
    --purple: #8b5cf6;
    --user-bg: linear-gradient(135deg, #ff6b9e, #ff9ebf);
    --ai-bg: #ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background: var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  
  header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:rgba(255,255,255,0.8); border-bottom:1px solid rgba(0,0,0,0.05); backdrop-filter: blur(10px); z-index: 10;}
  .title { font-size:18px; font-weight:900; background:linear-gradient(90deg, var(--pink), var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .clear-btn { background:transparent; border:1px solid #ccc; color:#888; padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer;}
  .clear-btn:hover { border-color:var(--pink); color:var(--pink);}

  #chatContainer { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:20px; scroll-behavior: smooth;}
  .message { display:flex; max-width:85%; animation: fadeIn 0.3s ease-out;}
  .message.user { align-self: flex-end; justify-content: flex-end;}
  .message.ai { align-self: flex-start;}
  
  .bubble { padding:14px 18px; border-radius:16px; font-size:15px; line-height:1.6; word-break: break-word; white-space: pre-wrap;}
  .user .bubble { background:var(--user-bg); color:#fff; border-bottom-right-radius:4px; box-shadow: 0 4px 10px rgba(255, 107, 158, 0.2);}
  .ai .bubble { background:var(--ai-bg); color:var(--text); border-bottom-left-radius:4px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);}

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* 深度思考折叠面板样式 */
  details.think-box { margin-bottom: 10px; font-size: 13px; color: #666; background: #f9f9f9; border-radius: 8px; padding: 10px; border: 1px solid #eee;}
  details.think-box summary { cursor: pointer; color: #8b5cf6; font-weight: bold; outline: none; user-select: none;}
  details.think-box p { margin-top: 8px; white-space: pre-wrap; line-height: 1.5; color: #888; border-left: 2px solid #ccc; padding-left: 8px;}

  .input-area { padding:15px 20px; background:rgba(255,255,255,0.9); border-top:1px solid rgba(0,0,0,0.05); display:flex; gap:10px; align-items:flex-end; padding-bottom: env(safe-area-inset-bottom, 15px);}
  textarea { flex:1; background:#f5f5f5; border:none; border-radius:12px; padding:14px; font-size:15px; color:var(--text); outline:none; resize:none; max-height:120px; min-height:52px; line-height: 1.5;}
  textarea:focus { background:#fff; box-shadow:0 0 0 2px rgba(255, 107, 158, 0.2);}
  
  .send-btn { background:linear-gradient(135deg, var(--pink), var(--purple)); color:#fff; border:none; width:52px; height:52px; border-radius:12px; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.1s, opacity 0.2s;}
  .send-btn:active { transform:scale(0.92);}
  .send-btn:disabled { opacity: 0.5; cursor:not-allowed;}

  .typing { display:flex; gap:4px; padding:8px 4px;}
  .typing span { width:6px; height:6px; background:#ccc; border-radius:50%; animation: bounce 1.4s infinite ease-in-out both;}
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<header>
  <div class="title">DeepSeek 深度思考助手</div>
  <button class="clear-btn" id="clearBtn">清空</button>
</header>

<main id="chatContainer"></main>

<div class="input-area">
  <textarea id="messageInput" rows="1" placeholder="输入内容..."></textarea>
  <button class="send-btn" id="sendBtn">➤</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.supabase === 'undefined') {
      document.getElementById('chatContainer').innerHTML = '<div class="message ai"><div class="bubble" style="color:red">⚠️ Supabase SDK 加载失败，请刷新重试。</div></div>';
      return;
    }

    const VERCEL_PROXY_URL = 'https://leo-pgxa.vercel.app/api/deepseek'; 
    const SUPABASE_URL = 'https://pitrqhoudtzwhmaejsdk.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_p8PFT4wTiunwiN7B7R3I2w_356h75Za';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    
    let currentUser = null;
    let chatHistory = [{ role: 'system', content: '你是一个智能、贴心、准确的 AI 助手。' }];

    sendBtn.addEventListener('click', sendMessage);
    clearBtn.addEventListener('click', clearChat);

    async function initApp() {
      chatContainer.innerHTML = '<div class="message ai"><div class="bubble">正在连接数据库...</div></div>';
      try {
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) throw sessionError;

        if (!session) {
          const { data, error } = await supabase.auth.signInAnonymously();
          if (error) throw new Error("匿名登录失败: " + error.message);
          currentUser = data.user;
        } else {
          currentUser = session.user;
        }
        loadHistory();
      } catch (err) {
        chatContainer.innerHTML = '';
        appendMessage('ai', `⚠️ 连接失败：${err.message}`);
      }
    }

    async function loadHistory() {
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });
      
      chatContainer.innerHTML = ''; 
      if (error) { appendMessage('ai', '加载历史记录失败：' + error.message); return; }

      if (data.length === 0) {
        appendMessage('ai', '你好！我是已开启深度思考的 AI 助手，有什么我可以帮你的吗？');
      } else {
        data.forEach(msg => appendMessage(msg.role, msg.content));
        chatHistory = [
          { role: 'system', content: '你是一个智能、贴心、准确的 AI 助手。' },
          ...data.map(m => ({ role: m.role, content: m.content }))
        ];
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      appendMessage('user', text);
      messageInput.value = '';
      messageInput.style.height = '52px';
      chatHistory.push({ role: 'user', content: text });

      await supabase.from('messages').insert({ user_id: currentUser.id, role: 'user', content: text });

      sendBtn.disabled = true;
      const loadingId = appendLoading();

      try {
        const response = await fetch(VERCEL_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory }),
        });

        const data = await response.json();
        document.getElementById(loadingId)?.remove();

        if (!response.ok) throw new Error(data.error || 'API 请求失败');

        if (data.choices && data.choices[0]) {
          const aiMsg = data.choices[0].message;
          const aiText = aiMsg.content;
          const thinkText = aiMsg.reasoning_content; // 获取思考过程

          appendMessage('ai', aiText, thinkText);
          chatHistory.push({ role: 'assistant', content: aiText });

          await supabase.from('messages').insert({ user_id: currentUser.id, role: 'assistant', content: aiText });
        }
      } catch (error) {
        document.getElementById(loadingId)?.remove();
        appendMessage('ai', `⚠️ AI 出错: ${error.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    // 渲染消息（支持渲染思考过程）
    function appendMessage(role, text, thinkText = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      // 如果有思考过程，先插入折叠面板
      if (thinkText) {
        const details = document.createElement('details');
        details.className = 'think-box';
        details.innerHTML = `<summary>已深度思考 (点击展开)</summary><p>${thinkText}</p>`;
        bubble.appendChild(details);
      }

      // 插入正式回复
      const textNode = document.createElement('div');
      textNode.textContent = text;
      bubble.appendChild(textNode);

      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendLoading() {
      const id = 'loading-' + Date.now();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ai';
      msgDiv.id = id;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return id;
    }

    async function clearChat() {
      if(!currentUser) return;
      if(!confirm('确定要清空你的专属记录吗？')) return;
      await supabase.from('messages').delete().eq('user_id', currentUser.id);
      chatContainer.innerHTML = '';
      chatHistory = [{ role: 'system', content: '你是一个智能、贴心、准确的 AI 助手。' }];
      appendMessage('ai', '记录已清空，我们重新开始吧！');
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    messageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    initApp();
  });
</script>
</body>
</html>
