<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>磊哥智能体</title>

<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="磊哥智能体">

<style>
  :root{ 
    --bg: linear-gradient(135deg, #f0f4ff 0%, #ffeef8 100%);
    --text: #333333; 
    --pink: #ff6b9e; 
    --purple: #8b5cf6;
    --user-bg: linear-gradient(135deg, #ff6b9e, #ff9ebf);
    --ai-bg: #ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background: var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  
  header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:rgba(255,255,255,0.8); border-bottom:1px solid rgba(0,0,0,0.05); backdrop-filter: blur(10px); z-index: 10;}
  .title { font-size:18px; font-weight:900; background:linear-gradient(90deg, var(--pink), var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  
  .header-actions { display: flex; gap: 10px; }
  .icon-btn { background:transparent; border:1px solid #ccc; color:#888; padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer; display:flex; align-items:center;}
  .icon-btn:hover { border-color:var(--pink); color:var(--pink);}
  .icon-btn.active { border-color:var(--pink); color:var(--pink); background: rgba(255,107,158,0.1); }

  #chatContainer { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:20px; scroll-behavior: smooth;}
  .message { display:flex; max-width:85%; animation: fadeIn 0.3s ease-out;}
  .message.user { align-self: flex-end; justify-content: flex-end;}
  .message.ai { align-self: flex-start;}
  
  .bubble { padding:14px 18px; border-radius:16px; font-size:15px; line-height:1.6; word-break: break-word; white-space: pre-wrap;}
  .user .bubble { background:var(--user-bg); color:#fff; border-bottom-right-radius:4px; box-shadow: 0 4px 10px rgba(255, 107, 158, 0.2);}
  .ai .bubble { background:var(--ai-bg); color:var(--text); border-bottom-left-radius:4px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);}

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  details.think-box { margin-bottom: 10px; font-size: 13px; color: #666; background: #f9f9f9; border-radius: 8px; padding: 10px; border: 1px solid #eee;}
  details.think-box summary { cursor: pointer; color: #8b5cf6; font-weight: bold; outline: none; }
  details.think-box p { margin-top: 8px; white-space: pre-wrap; color: #888; border-left: 2px solid #ccc; padding-left: 8px;}

  .input-area { padding:15px 20px; background:rgba(255,255,255,0.9); border-top:1px solid rgba(0,0,0,0.05); display:flex; gap:10px; align-items:flex-end; padding-bottom: env(safe-area-inset-bottom, 15px);}
  textarea { flex:1; background:#f5f5f5; border:none; border-radius:12px; padding:14px; font-size:15px; color:var(--text); outline:none; resize:none; max-height:120px; min-height:52px; line-height: 1.5;}
  textarea:focus { background:#fff; box-shadow:0 0 0 2px rgba(255, 107, 158, 0.2);}
  
  .send-btn { background:linear-gradient(135deg, var(--pink), var(--purple)); color:#fff; border:none; width:52px; height:52px; border-radius:12px; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.1s, opacity 0.2s;}
  .send-btn:active { transform:scale(0.92);}
  .send-btn:disabled { opacity: 0.5; cursor:not-allowed;}

  .typing { display:flex; gap:4px; padding:8px 4px;}
  .typing span { width:6px; height:6px; background:#ccc; border-radius:50%; animation: bounce 1.4s infinite ease-in-out both;}
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<header>
  <div class="title">磊哥智能体</div>
  <div class="header-actions">
    <!-- 语音开关按钮 -->
    <button class="icon-btn" id="voiceBtn" title="开启/关闭语音播报">🔇 朗读</button>
    <button class="icon-btn" id="clearBtn">清空</button>
  </div>
</header>

<main id="chatContainer"></main>

<div class="input-area">
  <textarea id="messageInput" rows="1" placeholder="输入内容..."></textarea>
  <button class="send-btn" id="sendBtn">➤</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.supabase === 'undefined') {
      document.getElementById('chatContainer').innerHTML = '<div class="message ai"><div class="bubble" style="color:red">⚠️ Supabase SDK 加载失败，请刷新重试。</div></div>';
      return;
    }

    const VERCEL_PROXY_URL = 'https://leo-pgxa.vercel.app/api/deepseek'; 
    const SUPABASE_URL = 'https://pitrqhoudtzwhmaejsdk.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_p8PFT4wTiunwiN7B7R3I2w_356h75Za';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    
    let currentUser = null;
    let chatHistory = [{ role: 'system', content: '你是磊哥智能体，一个智能、贴心、准确的 AI 助手。' }];
    
    // 语音相关状态
    let isVoiceEnabled = false; // 默认关闭
    let voices = [];
    
    // 预加载语音包 (部分浏览器需要)
    window.speechSynthesis.onvoiceschanged = () => {
      voices = window.speechSynthesis.getVoices();
    };

    sendBtn.addEventListener('click', sendMessage);
    clearBtn.addEventListener('click', clearChat);
    
    // 语音开关点击事件
    voiceBtn.addEventListener('click', () => {
      isVoiceEnabled = !isVoiceEnabled;
      if (isVoiceEnabled) {
        voiceBtn.innerHTML = '🔊 朗读';
        voiceBtn.classList.add('active');
        speakText("语音播报已开启"); // 测试发音
      } else {
        voiceBtn.innerHTML = '🔇 朗读';
        voiceBtn.classList.remove('active');
        window.speechSynthesis.cancel(); // 停止当前正在播放的语音
      }
    });

    async function initApp() {
      chatContainer.innerHTML = '<div class="message ai"><div class="bubble">正在连接云端大脑...</div></div>';
      try {
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) throw sessionError;

        if (!session) {
          const { data, error } = await supabase.auth.signInAnonymously();
          if (error) throw new Error(`[${error.status}] ${error.message}`);
          currentUser = data.user;
        } else {
          currentUser = session.user;
        }
        loadHistory();
      } catch (err) {
        chatContainer.innerHTML = '';
        appendMessage('ai', `⚠️ 连接失败：\n${err.message}`);
      }
    }

    async function loadHistory() {
      const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
      chatContainer.innerHTML = ''; 
      if (error) { appendMessage('ai', '加载记录失败：' + error.message); return; }
      if (data.length === 0) {
        appendMessage('ai', '你好！我是磊哥智能体，有什么我可以帮你的吗？');
      } else {
        data.forEach(msg => appendMessage(msg.role, msg.content));
        chatHistory = [
          { role: 'system', content: '你是磊哥智能体，一个智能、贴心、准确的 AI 助手。' },
          ...data.map(m => ({ role: m.role, content: m.content }))
        ];
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      // 用户发消息时，停止正在播放的语音
      window.speechSynthesis.cancel();

      appendMessage('user', text);
      messageInput.value = '';
      messageInput.style.height = '52px';
      chatHistory.push({ role: 'user', content: text });

      await supabase.from('messages').insert({ user_id: currentUser.id, role: 'user', content: text });

      sendBtn.disabled = true;
      const loadingId = appendLoading();

      try {
        const response = await fetch(VERCEL_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory }),
        });
        const data = await response.json();
        document.getElementById(loadingId)?.remove();

        if (!response.ok) throw new Error(data.error || 'API 请求失败');

        if (data.choices && data.choices[0]) {
          const aiMsg = data.choices[0].message;
          appendMessage('ai', aiMsg.content, aiMsg.reasoning_content);
          chatHistory.push({ role: 'assistant', content: aiMsg.content });
          await supabase.from('messages').insert({ user_id: currentUser.id, role: 'assistant', content: aiMsg.content });
          
          // 如果开启了语音，则朗读内容
          if (isVoiceEnabled) {
            speakText(aiMsg.content);
          }
        }
      } catch (error) {
        document.getElementById(loadingId)?.remove();
        appendMessage('ai', `⚠️ 请求出错: ${error.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    // 语音合成核心函数
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert("你的浏览器不支持语音播报功能哦~");
        return;
      }
      
      // 停止之前的朗读
      window.speechSynthesis.cancel();
      
      // 去除 markdown 符号，让朗读更自然
      const cleanText = text.replace(/[*#`~]/g, '');
      
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-CN'; // 设置中文
      utterance.rate = 1.1;     // 语速稍微快一点点
      utterance.pitch = 1.0;    // 音调
      
      // 尝试寻找中文语音包
      if (voices.length === 0) voices = window.speechSynthesis.getVoices();
      const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
      if (zhVoice) utterance.voice = zhVoice;

      window.speechSynthesis.speak(utterance);
    }

    function appendMessage(role, text, thinkText = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (thinkText) {
        const details = document.createElement('details');
        details.className = 'think-box';
        details.innerHTML = `<summary>已深度思考 (点击展开)</summary><p>${thinkText}</p>`;
        bubble.appendChild(details);
      }
      const textNode = document.createElement('div');
      textNode.textContent = text;
      bubble.appendChild(textNode);
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendLoading() {
      const id = 'loading-' + Date.now();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ai'; msgDiv.id = id;
      msgDiv.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return id;
    }

    async function clearChat() {
      if(!currentUser) return;
      if(!confirm('确定要清空历史记录吗？')) return;
      window.speechSynthesis.cancel(); // 清空时停止朗读
      await supabase.from('messages').delete().eq('user_id', currentUser.id);
      chatContainer.innerHTML = '';
      chatHistory = [{ role: 'system', content: '你是磊哥智能体，一个智能、贴心、准确的 AI 助手。' }];
      appendMessage('ai', '记录已清空，我们重新开始吧！');
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    messageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    initApp();
  });
</script>
</body>
</html>
