<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>星际穿梭 · Star Runner</title>
<style>
  :root{ --cyan:#3ee8ff; --pink:#ff3d8b; --mint:#5cffc0; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8f6ff;user-select:none}
  #game{position:fixed;inset:0}
  #game canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;padding:22px 26px;
       display:flex;justify-content:space-between;align-items:flex-start;
       font-variant-numeric:tabular-nums}
  .hud .label{font-size:11px;letter-spacing:4px;opacity:.45;margin-bottom:2px}
  .hud .score{font-size:36px;font-weight:800;letter-spacing:2px;color:var(--cyan);
              text-shadow:0 0 22px rgba(62,232,255,.75)}
  .hud .right{text-align:right}
  .hud .right .val{font-size:18px;font-weight:700;color:#8fe3ff;opacity:.85}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,rgba(10,30,60,.55),rgba(2,3,10,.93));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .35s ease}
  .overlay.hidden{opacity:0;pointer-events:none}
  .card{text-align:center;padding:40px 46px;max-width:480px}

  .title{font-size:46px;font-weight:900;letter-spacing:10px;
    background:linear-gradient(90deg,#3ee8ff,#5cffc0,#ff3d8b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(62,232,255,.45))}
  .subtitle{font-size:11px;letter-spacing:9px;opacity:.45;margin-top:8px;text-transform:uppercase}

  .tips{margin:30px 0 34px;font-size:14px;line-height:2.1;opacity:.75}
  .tips b{color:var(--cyan);font-weight:600}
  .key{display:inline-block;padding:1px 9px;border:1px solid rgba(255,255,255,.22);
       border-radius:5px;font-size:12px;margin:0 2px;opacity:.9}

  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;
    padding:16px 56px;font-size:16px;font-weight:800;letter-spacing:5px;
    color:#001018;background:linear-gradient(135deg,#5cffc0,#3ee8ff);
    box-shadow:0 0 36px rgba(62,232,255,.5);
    transition:transform .18s,box-shadow .18s;font-family:inherit}
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 52px rgba(62,232,255,.85)}
  .btn:active{transform:scale(.96)}

  .bigscore{font-size:68px;font-weight:900;color:#fff;line-height:1;margin:16px 0 8px;
            text-shadow:0 0 44px rgba(62,232,255,.7)}
  .best{font-size:13px;letter-spacing:3px;opacity:.55;margin-bottom:30px}
  #flash{position:fixed;inset:0;background:#ff2d6f;opacity:0;pointer-events:none;
         transition:opacity .12s ease}
</style>
</head>
<body>

<div id="game"></div>
<div id="flash"></div>

<div class="hud" id="hud" style="display:none">
  <div>
    <div class="label">SCORE</div>
    <div class="score" id="score">0</div>
  </div>
  <div class="right">
    <div class="label">BEST</div>
    <div class="val" id="bestHud">0</div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <div class="title">星际穿梭</div>
    <div class="subtitle">Star Runner</div>
    <div class="tips">
      移动<b>鼠标</b> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span class="key">↑↓←→</span> 操控飞船<br>
      躲避<b style="color:#ff3d8b">红色障碍</b>，收集<b style="color:#5cffc0">绿色能量球</b><br>
      速度会越来越快，飞得越久分数越高
    </div>
    <button class="btn" id="startBtn">开始飞行</button>
  </div>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="card">
    <div class="subtitle">飞行结束</div>
    <div class="bigscore" id="finalScore">0</div>
    <div class="best" id="finalBest">最高分 0</div>
    <button class="btn" id="retryBtn">再来一次</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ═══════════ 基础工具 ═══════════ */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const damp  = (k,dt)=>1-Math.exp(-k*dt);
const rnd   = (a,b)=>a+Math.random()*(b-a);

/* ═══════════ DOM ═══════════ */
const container   = document.getElementById('game');
const scoreEl     = document.getElementById('score');
const bestEl      = document.getElementById('bestHud');
const hudEl       = document.getElementById('hud');
const startScreen = document.getElementById('startScreen');
const overScreen  = document.getElementById('overScreen');
const finalScoreEl= document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const flashEl     = document.getElementById('flash');

/* ═══════════ 渲染器 ═══════════ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02030a, 0.0105);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 420);
camera.position.set(0, 2.6, 8.6);
camera.lookAt(0, 0, -16);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x02030a, 1);
container.appendChild(renderer.domElement);

/* ═══════════ 灯光 ═══════════ */
scene.add(new THREE.AmbientLight(0x6688cc, 1.7));

const keyLight = new THREE.DirectionalLight(0xbfe8ff, 2.4);
keyLight.position.set(4, 8, 6);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xff4a9a, 1.3);
rimLight.position.set(-6, -5, -9);
scene.add(rimLight);

/* ═══════════ 飞船 ═══════════ */
function buildShip(){
  const g = new THREE.Group();

  // 机身（四棱锥，尖头朝 -Z）
  const bodyGeo = new THREE.ConeGeometry(0.46, 1.9, 4, 1);
  bodyGeo.rotateX(-Math.PI/2);
  bodyGeo.rotateZ(Math.PI/4);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({
    color:0x9fe9ff, emissive:0x1b7fa8, emissiveIntensity:0.9,
    metalness:1, roughness:0.18, flatShading:true
  }));
  g.add(body);

  // 座舱
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 10),
    new THREE.MeshStandardMaterial({
      color:0x06202e, emissive:0x00e5ff, emissiveIntensity:1.8,
      metalness:1, roughness:0.05
    }));
  cockpit.position.set(0, 0.14, -0.18);
  cockpit.scale.set(1, 0.7, 1.6);
  g.add(cockpit);

  // 机翼
  const wingMat = new THREE.MeshStandardMaterial({
    color:0x2f8fc4, emissive:0x0a3a55, metalness:1, roughness:0.3, flatShading:true
  });
  const wings = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.09, 0.62), wingMat);
  wings.position.set(0, -0.06, 0.44);
  g.add(wings);

  const tipGeo = new THREE.BoxGeometry(0.13, 0.32, 0.5);
  for (const s of [-1, 1]){
    const t = new THREE.Mesh(tipGeo, wingMat);
    t.position.set(s * 0.87, 0.09, 0.44);
    g.add(t);
  }

  // 引擎核心
  const engine = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10),
    new THREE.MeshBasicMaterial({color:0x7dfbff}));
  engine.position.set(0, 0, 0.92);
  engine.scale.set(1, 1, 1.7);
  g.add(engine);

  // 尾焰光晕
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12),
    new THREE.MeshBasicMaterial({
      color:0x2fd8ff, transparent:true, opacity:0.22,
      depthWrite:false, blending:THREE.AdditiveBlending
    }));
  glow.position.set(0, 0, 1.15);
  glow.scale.set(1, 1, 2.4);
  g.add(glow);

  // 引擎灯
  const lamp = new THREE.PointLight(0x33e8ff, 34, 26, 2);
  lamp.position.set(0, 0, 1.6);
  g.add(lamp);

  return g;
}

const ship = buildShip();
scene.add(ship);

/* ═══════════ 隧道环 ═══════════ */
const RING_RADIUS = 6.6, RING_GAP = 13, RING_COUNT = 16;
const ringGeo = new THREE.TorusGeometry(RING_RADIUS, 0.045, 6, 72);
const rings = [];
for (let i = 0; i < RING_COUNT; i++){
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(0.52 + Math.random()*0.10, 0.9, 0.55),
    transparent:true, opacity:0.42, depthWrite:false
  });
  const r = new THREE.Mesh(ringGeo, mat);
  r.position.z = -i * RING_GAP;
  scene.add(r);
  rings.push(r);
}

/* ═══════════ 星空 ═══════════ */
const STAR_COUNT = 1200, STAR_RANGE = 200;
const starPos = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++){
  const a = Math.random() * Math.PI * 2;
  const rad = 8 + Math.random() * 72;
  starPos[i*3]   = Math.cos(a) * rad;
  starPos[i*3+1] = Math.sin(a) * rad;
  starPos[i*3+2] = -Math.random() * STAR_RANGE + 20;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color:0xaad4ff, size:0.55, sizeAttenuation:true,
  transparent:true, opacity:0.85, depthWrite:false
}));
scene.add(stars);

/* ═══════════ 障碍物资源 ═══════════ */
const OBSTACLE_GEOS = [
  new THREE.IcosahedronGeometry(1, 0),
  new THREE.OctahedronGeometry(1.05, 0),
  new THREE.DodecahedronGeometry(0.95, 0),
  new THREE.BoxGeometry(1.4, 1.4, 1.4),
  new THREE.TetrahedronGeometry(1.2, 0)
];
const obstacleMat = new THREE.MeshStandardMaterial({
  color:0xff2f74, emissive:0xb3003f, emissiveIntensity:1.3,
  metalness:0.75, roughness:0.32, flatShading:true
});

/* ═══════════ 能量球资源 ═══════════ */
const orbCoreGeo = new THREE.IcosahedronGeometry(0.34, 1);
const orbCoreMat = new THREE.MeshBasicMaterial({color:0x8dffd6});
const orbGlowGeo = new THREE.SphereGeometry(0.66, 16, 12);
const orbGlowMat = new THREE.MeshBasicMaterial({
  color:0x5cffc0, transparent:true, opacity:0.22,
  depthWrite:false, blending:THREE.AdditiveBlending
});

/* ═══════════ 游戏数据 ═══════════ */
const LIMIT_X = 4.7, LIMIT_Y = 3.3, PLACE_R = 5.0;

const obstacles = [];
const orbs = [];

let scrollSpeed = 0;
let pointerActive = false;
let pointerTargetX = 0, pointerTargetY = 0;
let prevShipX = 0, prevShipY = 0;

const state = {
  mode: 'ready',
  speed: 38,
  baseSpeed: 38,
  maxSpeed: 108,
  elapsed: 0,
  traveled: 0,
  nextSpawn: 0,
  score: 0,
  best: +(localStorage.getItem('starrunner_best') || 0)
};

/* ═══════════ 音效 ═══════════ */
let audioCtx = null;
function initAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function sfxPickup(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(760, t);
  o.frequency.exponentialRampToValueAtTime(1500, t + 0.10);
  g.gain.setValueAtTime(0.13, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.14);
}
function sfxBoom(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * 0.6);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const flt = audioCtx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = 850;
  const g = audioCtx.createGain(); g.gain.value = 0.4;
  src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
  src.start(t);
}

/* ═══════════ 生成逻辑 ═══════════ */
function spawnObstacle(){
  const geo = OBSTACLE_GEOS[(Math.random()*OBSTACLE_GEOS.length)|0];
  const mesh = new THREE.Mesh(geo, obstacleMat);
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * PLACE_R;
  const s = rnd(0.55, 1.05);
  mesh.position.set(Math.cos(a)*r, Math.sin(a)*r, -135 - Math.random()*25);
  mesh.scale.setScalar(s);
  mesh.rotation.set(Math.random()*6.28, Math.random()*6.28, Math.random()*6.28);
  scene.add(mesh);
  obstacles.push({
    mesh,
    radius: s * 1.0,
    spin: { x: rnd(-1.6,1.6), y: rnd(-1.6,1.6) }
  });
}

function spawnOrb(){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(orbGlowGeo, orbGlowMat));
  const core = new THREE.Mesh(orbCoreGeo, orbCoreMat);
  g.add(core);
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * 4.2;
  g.position.set(Math.cos(a)*r, Math.sin(a)*r, -130 - Math.random()*22);
  scene.add(g);
  orbs.push({ mesh:g, core });
}

function spawnWave(){
  const t = Math.min(1, state.elapsed / 80);
  const count = 2 + Math.round(Math.random() * (1 + t * 3));
  for (let i = 0; i < count; i++) spawnObstacle();
  if (Math.random() < 0.36) spawnOrb();
}

function spawnLogic(){
  if (state.traveled < state.nextSpawn) return;
  const t = Math.min(1, state.elapsed / 80);
  const interval = 0.95 - 0.42 * t;          // 波次之间的「时间」间隔
  state.nextSpawn = state.traveled + state.speed * interval;
  spawnWave();
}

/* ═══════════ 飞船操控 ═══════════ */
const keys = new Set();

function updateShip(dt){
  let dirX = 0, dirY = 0;
  if (keys.has('a') || keys.has('arrowleft'))  dirX -= 1;
  if (keys.has('d') || keys.has('arrowright')) dirX += 1;
  if (keys.has('w') || keys.has('arrowup'))    dirY += 1;
  if (keys.has('s') || keys.has('arrowdown'))  dirY -= 1;

  if (dirX || dirY){
    ship.position.x += dirX * 15 * dt;
    ship.position.y += dirY * 15 * dt;
    pointerTargetX = ship.position.x;
    pointerTargetY = ship.position.y;
  } else if (pointerActive){
    const k = damp(17, dt);
    ship.position.x += (pointerTargetX - ship.position.x) * k;
    ship.position.y += (pointerTargetY - ship.position.y) * k;
  }

  ship.position.x = clamp(ship.position.x, -LIMIT_X, LIMIT_X);
  ship.position.y = clamp(ship.position.y, -LIMIT_Y, LIMIT_Y);

  // 根据速度做倾斜，增强手感
  const vx = (ship.position.x - prevShipX) / Math.max(dt, 1e-4);
  const vy = (ship.position.y - prevShipY) / Math.max(dt, 1e-4);
  const k = damp(11, dt);
  ship.rotation.z += (-vx * 0.035 - ship.rotation.z) * k;
  ship.rotation.x += ( vy * 0.030 - ship.rotation.x) * k;
  ship.rotation.y += (0 - ship.rotation.y) * k;

  prevShipX = ship.position.x;
  prevShipY = ship.position.y;
}

/* ═══════════ 世界更新 ═══════════ */
function updateWorld(dt){
  const dz = scrollSpeed * dt;

  // 隧道环
  for (const r of rings){
    r.position.z += dz;
    if (r.position.z > 14) r.position.z -= RING_COUNT * RING_GAP;
  }

  // 星空
  const sp = starGeo.attributes.position;
  for (let i = 0; i < STAR_COUNT; i++){
    let z = sp.array[i*3+2] + dz * 0.6;
    if (z > 20) z -= STAR_RANGE;
    sp.array[i*3+2] = z;
  }
  sp.needsUpdate = true;

  // 障碍物
  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    const prevZ = o.mesh.position.z;
    o.mesh.position.z += dz;
    o.mesh.rotation.x += o.spin.x * dt;
    o.mesh.rotation.y += o.spin.y * dt;

    if (state.mode === 'playing' && prevZ < 0 && o.mesh.position.z >= 0){
      const dx = o.mesh.position.x - ship.position.x;
      const dy = o.mesh.position.y - ship.position.y;
      if (Math.hypot(dx, dy) < o.radius + 0.5){ crash(); }
    }

    if (o.mesh.position.z > 16){
      scene.remove(o.mesh);
      obstacles.splice(i, 1);
    }
  }

  // 能量球
  for (let i = orbs.length - 1; i >= 0; i--){
    const o = orbs[i];
    const prevZ = o.mesh.position.z;
    o.mesh.position.z += dz;
    o.core.rotation.x += 2.2 * dt;
    o.core.rotation.y += 3.0 * dt;
    o.mesh.position.y += Math.sin(performance.now()*0.003 + i) * 0.004;

    if (state.mode === 'playing' && prevZ < 0 && o.mesh.position.z >= 0){
      const dx = o.mesh.position.x - ship.position.x;
      const dy = o.mesh.position.y - ship.position.y;
      if (Math.hypot(dx, dy) < 1.35){
        state.score += 50;
        sfxPickup();
        scene.remove(o.mesh);
        orbs.splice(i, 1);
        continue;
      }
    }

    if (o.mesh.position.z > 16){
      scene.remove(o.mesh);
      orbs.splice(i, 1);
    }
  }
}

/* ═══════════ 相机 ═══════════ */
function updateCamera(dt){
  const k = damp(6, dt);
  camera.position.x += (ship.position.x * 0.5 - camera.position.x) * k;
  camera.position.y += (2.6 + ship.position.y * 0.5 - camera.position.y) * k;
  camera.position.z = 8.6;
  camera.lookAt(ship.position.x * 0.35, ship.position.y * 0.35 - 0.3, -16);
}

/* ═══════════ 爆炸粒子 ═══════════ */
const explosion = { points:null, vels:[], life:0, maxLife:1.3 };

function createExplosion(pos){
  const N = 110;
  const positions = new Float32Array(N * 3);
  const vels = [];
  for (let i = 0; i < N; i++){
    positions[i*3]   = pos.x;
    positions[i*3+1] = pos.y;
    positions[i*3+2] = pos.z;
    const v = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5)
      .normalize().multiplyScalar(3 + Math.random()*15);
    vels.push(v);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color:0xffb04d, size:0.55, transparent:true, opacity:1,
    depthWrite:false, blending:THREE.AdditiveBlending
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  explosion.points = pts;
  explosion.vels = vels;
  explosion.life = 1.3;
  explosion.maxLife = 1.3;
}

function updateParticles(dt){
  if (!explosion.points) return;
  explosion.life -= dt;
  if (explosion.life <= 0){
    scene.remove(explosion.points);
    explosion.points.geometry.dispose();
    explosion.points.material.dispose();
    explosion.points = null;
    return;
  }
  const pos = explosion.points.geometry.attributes.position;
  const drag = 1 - 2.2 * dt;
  for (let i = 0; i < explosion.vels.length; i++){
    const v = explosion.vels[i];
    pos.array[i*3]   += v.x * dt;
    pos.array[i*3+1] += v.y * dt;
    pos.array[i*3+2] += v.z * dt;
    v.multiplyScalar(drag);
  }
  pos.needsUpdate = true;
  explosion.points.material.opacity = Math.max(0, explosion.life / explosion.maxLife);
}

/* ═══════════ 游戏流程 ═══════════ */
function startGame(){
  initAudio();

  state.mode = 'playing';
  state.elapsed = 0;
  state.speed = state.baseSpeed;
  state.traveled = 0;
  state.nextSpawn = 45;
  state.score = 0;

  for (const o of obstacles) scene.remove(o.mesh);
  obstacles.length = 0;
  for (const o of orbs) scene.remove(o.mesh);
  orbs.length = 0;

  ship.visible = true;
  ship.position.set(0, 0, 0);
  ship.rotation.set(0, 0, 0);
  prevShipX = 0; prevShipY = 0;
  pointerTargetX = 0; pointerTargetY = 0;
  pointerActive = false;

  scoreEl.textContent = '0';
  bestEl.textContent = state.best;
  hudEl.style.display = 'flex';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
}

function crash(){
  if (state.mode !== 'playing') return;
  state.mode = 'over';
  ship.visible = false;

  createExplosion(ship.position);
  sfxBoom();

  flashEl.style.opacity = '0.9';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 90);

  const finalScore = Math.floor(state.score);
  if (finalScore > state.best){
    state.best = finalScore;
    localStorage.setItem('starrunner_best', String(state.best));
  }

  setTimeout(() => {
    finalScoreEl.textContent = finalScore;
    finalBestEl.textContent = '最高分 ' + state.best;
    overScreen.classList.remove('hidden');
    hudEl.style.display = 'none';
  }, 950);
}

/* ═══════════ 主循环 ═══════════ */
const clock = new THREE.Clock();

function update(dt){
  const time = performance.now() * 0.001;

  if (state.mode === 'playing'){
    state.elapsed += dt;
    const t = 1 - Math.exp(-state.elapsed / 45);
    state.speed = state.baseSpeed + (state.maxSpeed - state.baseSpeed) * t;
    state.traveled += state.speed * dt;
    scrollSpeed = state.speed;

    updateShip(dt);
    spawnLogic();

    state.score += state.speed * dt * 0.35;
    scoreEl.textContent = Math.floor(state.score);

  } else if (state.mode === 'ready'){
    scrollSpeed = 22;
    ship.position.y = Math.sin(time * 1.5) * 0.22;
    ship.rotation.y = Math.sin(time * 0.6) * 0.25;
    ship.rotation.z = Math.sin(time * 0.9) * 0.06;
  } else {
    scrollSpeed *= Math.exp(-4 * dt);
    if (scrollSpeed < 0.4) scrollSpeed = 0;
  }

  updateWorld(dt);
  updateParticles(dt);
  updateCamera(dt);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

/* ═══════════ 输入 ═══════════ */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys.add(k);
  if (k === ' ' && state.mode !== 'playing') startGame();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

// 鼠标：绝对位置映射
addEventListener('mousemove', e => {
  if (state.mode !== 'playing') return;
  const nx = (e.clientX / innerWidth) * 2 - 1;
  const ny = -((e.clientY / innerHeight) * 2 - 1);
  pointerTargetX = nx * LIMIT_X;
  pointerTargetY = ny * LIMIT_Y;
  pointerActive = true;
});

// 触摸：相对拖动
let touchId = null, lastTX = 0, lastTY = 0;
addEventListener('touchstart', e => {
  if (state.mode !== 'playing') return;
  const t = e.changedTouches[0];
  touchId = t.identifier;
  lastTX = t.clientX; lastTY = t.clientY;
}, { passive:true });

addEventListener('touchmove', e => {
  if (state.mode !== 'playing' || touchId === null) return;
  for (const t of e.changedTouches){
    if (t.identifier !== touchId) continue;
    const dx = t.clientX - lastTX;
    const dy = t.clientY - lastTY;
    lastTX = t.clientX; lastTY = t.clientY;
    pointerTargetX = clamp(pointerTargetX + dx * 0.045, -LIMIT_X, LIMIT_X);
    pointerTargetY = clamp(pointerTargetY - dy * 0.045, -LIMIT_Y, LIMIT_Y);
    pointerActive = true;
  }
  e.preventDefault();
}, { passive:false });

addEventListener('touchend', e => {
  for (const t of e.changedTouches){
    if (t.identifier === touchId) touchId = null;
  }
}, { passive:true });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

/* ═══════════ 自适应 ═══════════ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ═══════════ 启动 ═══════════ */
bestEl.textContent = state.best;
animate();
</script>
