<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>极速狂飙 · 赛博赛道</title>
<style>
  :root{ --cyan:#3ee8ff; --pink:#ff3d8b; --mint:#5cffc0; --purple:#b066ff; --red:#ff4d4d; --blue:#4da6ff; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8f6ff;user-select:none}
  #game{position:fixed;inset:0}
  #game canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;padding:22px 26px;
       display:flex;justify-content:space-between;align-items:flex-start;
       font-variant-numeric:tabular-nums; z-index: 5;}
  .hud-left { display: flex; flex-direction: column; gap: 8px; }
  .hud .label{font-size:11px;letter-spacing:4px;opacity:.45;margin-bottom:2px}
  
  .hud .score{font-size:36px;font-weight:800;letter-spacing:2px;color:var(--cyan);
              text-shadow:0 0 22px rgba(62,232,255,.75); transition: transform 0.1s;}
  .hud .score.pop { transform: scale(1.3); color: #fff; text-shadow:0 0 30px #fff; }

  .hud .right{text-align:right}
  .hud .right .val{font-size:18px;font-weight:700;color:#8fe3ff;opacity:.85}

  /* 速度表 */
  #speedHud { position: fixed; bottom: 20px; right: 20px; font-size: 28px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 15px var(--cyan); opacity: 0; transition: opacity 0.3s; z-index: 5; pointer-events: none;}
  #speedHud.active { opacity: 1; }
  #speedHud .unit { font-size: 14px; color: #8fe3ff; }

  /* 道具状态栏 */
  .powerup-hud { display: flex; gap: 15px; margin-top: 10px; opacity: 0; transition: opacity 0.3s; }
  .powerup-hud.active { opacity: 1; }
  .pu-icon { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; padding: 4px 10px; border-radius: 8px; backdrop-filter: blur(4px); }
  .pu-icon.shield { color: var(--blue); border: 1px solid rgba(77,166,255,.3); background: rgba(77,166,255,.1); text-shadow: 0 0 10px var(--blue); }
  .pu-icon.weapon { color: var(--red); border: 1px solid rgba(255,77,77,.3); background: rgba(255,77,77,.1); text-shadow: 0 0 10px var(--red); }
  .pu-icon.boost { color: #ffea00; border: 1px solid rgba(255,234,0,.3); background: rgba(255,234,0,.1); text-shadow: 0 0 10px #ffea00; }

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,rgba(10,30,60,.55),rgba(2,3,10,.93));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .35s ease; z-index: 10;}
  .overlay.hidden{opacity:0;pointer-events:none}
  .card{text-align:center;padding:40px 46px;max-width:480px;position:relative;}

  .title{font-size:46px;font-weight:900;letter-spacing:10px;
    background:linear-gradient(90deg,#3ee8ff,#5cffc0,#ff3d8b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(62,232,255,.45))}
  .subtitle{font-size:11px;letter-spacing:9px;opacity:.45;margin-top:8px;text-transform:uppercase}

  .tips{margin:30px 0 34px;font-size:14px;line-height:2.1;opacity:.75}
  .tips b{color:var(--cyan);font-weight:600}
  .key{display:inline-block;padding:1px 9px;border:1px solid rgba(255,255,255,.22);
       border-radius:5px;font-size:12px;margin:0 2px;opacity:.9}

  .btn-group{display:flex;gap:15px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;
    padding:16px 40px;font-size:16px;font-weight:800;letter-spacing:3px;
    color:#001018;background:linear-gradient(135deg,#5cffc0,#3ee8ff);
    box-shadow:0 0 36px rgba(62,232,255,.5);
    transition:transform .18s,box-shadow .18s,background .18s;font-family:inherit}
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 52px rgba(62,232,255,.85)}
  .btn:active{transform:scale(.96)}

  .btn * { pointer-events: none; }

  .btn-secondary{background:transparent;border:1px solid rgba(62,232,255,.35);color:#8fe3ff;box-shadow:none;}
  .btn-secondary:hover{background:rgba(62,232,255,.1);box-shadow:0 0 25px rgba(62,232,255,.2);}

  .btn-reward {background: linear-gradient(135deg, #ff3d8b, #ff8a3d); color: #fff; box-shadow: 0 0 30px rgba(255,61,139,.4); padding: 14px 28px; font-size: 14px; letter-spacing: 1px;}
  .btn-reward:hover {box-shadow: 0 0 40px rgba(255,61,139,.75);}

  .version { font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.3); margin-top: 24px; font-family: monospace; }

  .bigscore{font-size:68px;font-weight:900;color:#fff;line-height:1;margin:16px 0 8px;
            text-shadow:0 0 44px rgba(62,232,255,.7)}
  .best{font-size:13px;letter-spacing:3px;opacity:.55;margin-bottom:30px}
  
  #flash{position:fixed;inset:0;background:#ff2d6f;opacity:0;pointer-events:none;transition:opacity .1s ease; z-index: 99;}
  #nukeFlash{position:fixed;inset:0;background:#b066ff;opacity:0;pointer-events:none;transition:opacity .3s ease; z-index: 98;}

  .toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: 28px; font-weight: 900; letter-spacing: 5px; pointer-events: none; opacity: 0; z-index: 50; text-shadow: 0 0 30px currentColor; }
  @keyframes toastAnim { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(0.9); } }

  .qr-placeholder {
    width: 110px; height: 110px; margin: 15px auto;
    background: #fff; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .qr-placeholder:hover { transform: scale(1.05); }
  .qr-placeholder img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 2; }

  .heart-particle { position: fixed; pointer-events: none; z-index: 100; font-size: 24px; animation: fall linear forwards; }
  @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg) scale(0.5); opacity: 0; } }
</style>
</head>
<body>

<audio id="bgm" src="./bgm.mp3" loop preload="auto"></audio>

<div id="game"></div>
<div id="nukeFlash"></div>
<div id="flash"></div>
<div id="toast" class="toast"></div>
<div id="speedHud">0 <span class="unit">km/h</span></div>

<div class="hud" id="hud" style="display:none">
  <div class="hud-left">
    <div>
      <div class="label">SCORE</div>
      <div class="score" id="score">0</div>
    </div>
    <div class="powerup-hud" id="powerupHud">
      <div class="pu-icon shield" id="puShield" style="display:none;">🛡️ <span id="shieldTime">0</span>s</div>
      <div class="pu-icon weapon" id="puWeapon" style="display:none;">🔫 <span id="weaponTime">0</span>s</div>
      <div class="pu-icon boost" id="puBoost" style="display:none;">⚡ 加速中</div>
    </div>
  </div>
  <div class="right">
    <div class="label">BEST</div>
    <div class="val" id="bestHud">0</div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <div class="title">极速狂飙</div>
    <div class="subtitle">Cyberpunk Highway</div>
    <div class="tips">
      移动<b>鼠标</b> 或 <span class="key">A</span><span class="key">D</span> <span class="key">←→</span> 操控赛车<br>
      躲避<b style="color:#ff3d8b">路障</b>，收集<b style="color:#5cffc0">能量球</b>与<b style="color:#b066ff">强化道具</b><br>
      压上<b style="color:#3ee8ff">蓝色加速带</b>，体验极限推背感！
    </div>
    <div class="btn-group">
      <button class="btn" id="startBtn">点火起步</button>
      <button class="btn btn-reward" id="rewardBtn">赞赏 ☕</button>
    </div>
    <div class="version">v3.0 赛车版</div>
  </div>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="card">
    <div class="subtitle">比赛结束</div>
    <div class="bigscore" id="finalScore">0</div>
    <div class="best" id="finalBest">最高分 0</div>
    <div class="btn-group">
      <button class="btn" id="retryBtn">再来一圈</button>
      <button class="btn btn-secondary" id="exitBtn">返回车库</button>
      <button class="btn btn-reward" id="rewardBtn2">赞赏 ☕</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="rewardModal" style="z-index: 20;">
  <div class="card" style="background: rgba(10, 20, 35, 0.8); border: 1px solid rgba(62,232,255,0.2); border-radius: 20px;">
    <div class="subtitle" style="color: var(--pink);">THANK YOU</div>
    <div style="font-size: 20px; font-weight: bold; margin: 15px 0 5px;">感谢您的支持！</div>
    <div style="font-size: 13px; opacity: 0.6; margin-bottom: 10px;">本游戏完全免费，您的支持是我更新的动力</div>
    <div class="qr-placeholder" id="qrContainer">
      <img src="./qrcode.png" alt="赞赏码">
    </div>
    <div style="font-size: 12px; opacity: 0.4; margin-bottom: 20px;">点击图片或背景关闭</div>
    <button class="btn btn-secondary" id="closeRewardBtn" style="padding: 10px 30px; font-size: 13px;">关闭</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const damp  = (k,dt)=>1-Math.exp(-k*dt);
const rnd   = (a,b)=>a+Math.random()*(b-a);

/* DOM */
const container   = document.getElementById('game');
const scoreEl     = document.getElementById('score');
const bestEl      = document.getElementById('bestHud');
const hudEl       = document.getElementById('hud');
const startScreen = document.getElementById('startScreen');
const overScreen  = document.getElementById('overScreen');
const finalScoreEl= document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const flashEl     = document.getElementById('flash');
const nukeFlashEl = document.getElementById('nukeFlash');
const rewardModal = document.getElementById('rewardModal');
const toastEl     = document.getElementById('toast');
const powerupHud  = document.getElementById('powerupHud');
const puShield    = document.getElementById('puShield');
const puWeapon    = document.getElementById('puWeapon');
const puBoost     = document.getElementById('puBoost');
const shieldTimeEl= document.getElementById('shieldTime');
const weaponTimeEl= document.getElementById('weaponTime');
const speedHud    = document.getElementById('speedHud');

/* 渲染场景 */
const scene = new THREE.Scene();
// 背景改为深紫色赛博朋克夜空
scene.background = new THREE.Color(0x0a0514);
scene.fog = new THREE.FogExp2(0x0a0514, 0.003);

const BASE_FOV = 75;
const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth/innerHeight, 0.1, 8000);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x334455, 2.0)); 
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(10, 20, 5); 
scene.add(keyLight);

/* 屏幕震动与顿帧系统 */
let shakeTime = 0;
let shakeIntensity = 0;
let hitStopTime = 0;

function triggerShake(time, intensity) {
  shakeTime = Math.max(shakeTime, time);
  shakeIntensity = Math.max(shakeIntensity, intensity);
}
function triggerHitStop(time) {
  hitStopTime = Math.max(hitStopTime, time);
}

/* 音效引擎 */
const Sound = {
  ctx:null, master:null, sfxGain:null, delayNode:null, ready:false,
  bgmAudio: document.getElementById('bgm'), fadeInterval: null,
  
  init(){
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.6;
        this.master.connect(this.ctx.destination);
        this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.9;
        this.sfxGain.connect(this.master);
        this.ready = true;
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  
  playBGM() {
    if (this.bgmAudio) {
      this.bgmAudio.volume = 0.25;
      this.bgmAudio.currentTime = 0;
      this.bgmAudio.play().catch(e => console.log('BGM拦截'));
    }
  },

  stopBGM() {
    if (this.bgmAudio) this.bgmAudio.pause();
    if (this.fadeInterval) clearInterval(this.fadeInterval);
  },

  fadeBGM(targetVol, duration){
    if (!this.bgmAudio) return;
    if (this.fadeInterval) clearInterval(this.fadeInterval);
    const stepTime = 50; const steps = (duration * 1000) / stepTime;
    const volumeStep = (targetVol - this.bgmAudio.volume) / steps;
    this.fadeInterval = setInterval(() => {
      let newVol = this.bgmAudio.volume + volumeStep;
      if ((volumeStep > 0 && newVol >= targetVol) || (volumeStep < 0 && newVol <= targetVol)) {
        this.bgmAudio.volume = Math.max(0, Math.min(1, targetVol));
        clearInterval(this.fadeInterval);
      } else {
        this.bgmAudio.volume = Math.max(0, Math.min(1, newVol));
      }
    }, stepTime);
  },

  pickup(){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1760, t+0.1);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t+0.2);
  },
  boost(){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(100, t); o.frequency.exponentialRampToValueAtTime(800, t+0.3);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t+0.4);
  },
  powerup(type){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'square';
    if(type==='shield'){ o.frequency.setValueAtTime(440, t); o.frequency.exponentialRampToValueAtTime(880, t+0.2); }
    else if(type==='weapon'){ o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(660, t+0.2); }
    else { o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(110, t+0.5); }
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t+0.5);
  },
  shoot(){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(200, t+0.1);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t+0.1);
  },
  explode(){
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o1 = this.ctx.createOscillator(); o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(150, t); o1.frequency.exponentialRampToValueAtTime(30, t+0.5);
    const o2 = this.ctx.createOscillator(); o2.type = 'sine';
    o2.frequency.setValueAtTime(60, t); o2.frequency.exponentialRampToValueAtTime(10, t+0.6);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.6);
    o1.connect(g); o2.connect(g); g.connect(this.sfxGain);
    o1.start(t); o1.stop(t+0.6); o2.start(t); o2.stop(t+0.6);
  }
};

/* 赛道数学（保持原有曲线逻辑，但改造成道路） */
function getCurveOffset(z) {
    const totalZ = state.traveled - z; 
    const x = Math.sin(totalZ * 0.0012) * 80 + Math.sin(totalZ * 0.0035) * 40;
    // 赛车游戏不再上下起伏，Y轴保持0，只做左右弯曲
    return new THREE.Vector3(x, 0, 0);
}
function getTangent(z) {
    const totalZ = state.traveled - z;
    const dx = Math.cos(totalZ * 0.0012) * 80 * 0.0012 + Math.cos(totalZ * 0.0035) * 40 * 0.0035;
    return new THREE.Vector3(dx, 0, -1).normalize();
}

/* 赛车模型 */
function buildCar(){
  const g = new THREE.Group();
  // 车身
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
  const neonMat = new THREE.MeshBasicMaterial({ color: 0x3ee8ff });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1, roughness: 0 });
  
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.5), bodyMat);
  chassis.position.y = 0.4;
  g.add(chassis);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.0), glassMat);
  cabin.position.set(0, 0.9, 0.2);
  g.add(cabin);

  // 尾翼
  const wing = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 0.6), bodyMat);
  wing.position.set(0, 1.0, 2.0);
  g.add(wing);

  // 霓虹灯条
  const neon1 = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.1, 0.1), neonMat);
  neon1.position.set(0, 0.2, -2.2); // 前脸
  g.add(neon1);
  
  const neon2 = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.1), new THREE.MeshBasicMaterial({color: 0xff3d8b}));
  neon2.position.set(0, 0.6, 2.2); // 尾部
  g.add(neon2);

  // 车轮
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.8 });
  
  const positions = [
    [-1.1, 0.4, -1.5], [1.1, 0.4, -1.5], // 前轮
    [-1.1, 0.4, 1.5], [1.1, 0.4, 1.5]    // 后轮
  ];
  positions.forEach(pos => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.position.set(...pos);
    g.add(w);
  });

  // 尾焰 / 底部辉光
  const glow = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 1.5), 
    new THREE.MeshBasicMaterial({ color: 0xff3d8b, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending })
  );
  glow.position.set(0, 0.1, 1.5);
  g.add(glow);

  return g;
}
const carPivot = new THREE.Group(); scene.add(carPivot);
const car = buildCar(); carPivot.add(car);

// 护盾特效
const shieldMesh = new THREE.Mesh(
  new THREE.SphereGeometry(3.0, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x4da6ff, transparent: true, opacity: 0.2, wireframe: true, blending: THREE.AdditiveBlending, depthWrite: false })
);
shieldMesh.visible = false;
car.add(shieldMesh);

/* 赛道两侧装饰光柱（增加速度感） */
const pillars = [];
const pillarGeo = new THREE.BoxGeometry(1, 20, 1);
const pillarMat = new THREE.MeshBasicMaterial({ color: 0x3ee8ff, transparent: true, opacity: 0.3 });
for (let i = 0; i < 40; i++) {
  const isLeft = i % 2 === 0;
  const mesh = new THREE.Mesh(pillarGeo, pillarMat);
  scene.add(mesh);
  pillars.push({ mesh, z: -i * 20, xOffset: isLeft ? -15 : 15 });
}

/* 障碍物工厂 (路障) */
const DEBRIS_GEOS = [
  new THREE.BoxGeometry(1.5, 1.5, 1.5),
  new THREE.CylinderGeometry(0.8, 0.8, 2, 6),
  new THREE.ConeGeometry(1, 2, 4)
];
const DEBRIS_MATS = [
  new THREE.MeshStandardMaterial({ color: 0xff9900, emissive: 0x552200 }), // 警示橙
  new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0x111111 })  // 废铁
];
const DEBRIS_SPARK = new THREE.MeshBasicMaterial({ color:0xffcc66 });
function makeDebris(){
  const grp = new THREE.Group();
  const m = new THREE.Mesh(DEBRIS_GEOS[Math.floor(Math.random()*DEBRIS_GEOS.length)], DEBRIS_MATS[Math.floor(Math.random()*DEBRIS_MATS.length)]);
  m.position.set(rnd(-0.5,0.5), rnd(-0.5,0.5), rnd(-0.5,0.5)); 
  m.rotation.set(rnd(0,6.28), rnd(0,6.28), rnd(0,6.28)); 
  grp.add(m);
  return grp;
}

/* 能量球与道具工厂 */
const orbCoreGeo = new THREE.IcosahedronGeometry(0.34, 1); const orbCoreMat = new THREE.MeshBasicMaterial({color:0x8dffd6});
const orbGlowGeo = new THREE.SphereGeometry(0.66, 16, 12); const orbGlowMat = new THREE.MeshBasicMaterial({ color:0x5cffc0, transparent:true, opacity:0.22, depthWrite:false, blending:THREE.AdditiveBlending });

const puShieldGeo = new THREE.OctahedronGeometry(0.5, 0); const puShieldMat = new THREE.MeshStandardMaterial({ color:0x4da6ff, emissive:0x4da6ff, emissiveIntensity:2, wireframe:true });
const puWeaponGeo = new THREE.BoxGeometry(0.4, 0.4, 0.8); const puWeaponMat = new THREE.MeshStandardMaterial({ color:0xff4d4d, emissive:0xff4d4d, emissiveIntensity:2 });
const puNukeGeo   = new THREE.TorusGeometry(0.4, 0.12, 8, 16); const puNukeMat = new THREE.MeshStandardMaterial({ color:0xb066ff, emissive:0xb066ff, emissiveIntensity:2 });

/* 加速带工厂 */
const boostPadGeo = new THREE.PlaneGeometry(3, 8);
const boostPadMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
function makeBoostPad() {
  const grp = new THREE.Group();
  const pad = new THREE.Mesh(boostPadGeo, boostPadMat);
  pad.rotation.x = -Math.PI / 2;
  grp.add(pad);
  // 添加箭头指示
  const arrowGeo = new THREE.ConeGeometry(1, 2, 3);
  const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for(let i=0; i<2; i++) {
    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
    arrow.rotation.x = -Math.PI / 2;
    arrow.position.set(0, 0.1, -2 + i*3);
    grp.add(arrow);
  }
  return grp;
}

/* 子弹工厂 */
const bulletGeo = new THREE.CylinderGeometry(0.08, 0.02, 2.0, 4); bulletGeo.rotateX(Math.PI / 2);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xff4d4d, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });

/* 游戏状态 */
// 赛车主要左右移动，上下范围缩小
const LIMIT_X = 6.0, LIMIT_Y = 1.5;
const obstacles = []; const orbs = []; const powerups = []; const bullets = []; const boostPads = [];
let scrollSpeed = 0; let pointerActive = false; let pointerTargetX = 0, pointerTargetY = 0; let prevShipX = 0, prevShipY = 0;

const state = {
  mode: 'ready', speed: 60, baseSpeed: 60, maxSpeed: 150, elapsed: 0, traveled: 0, nextSpawn: 0, score: 0,
  shipX: 0, shipY: 0, best: +(localStorage.getItem('racerunner_best') || 0),
  shieldTimer: 0, weaponTimer: 0, boostTimer: 0
};

const keys = new Set();

function showToast(text, color) {
  toastEl.innerText = text;
  toastEl.style.color = color;
  toastEl.style.animation = 'none';
  void toastEl.offsetWidth;
  toastEl.style.animation = 'toastAnim 1.5s ease forwards';
}

function popScore() {
  scoreEl.classList.remove('pop');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('pop');
  setTimeout(() => scoreEl.classList.remove('pop'), 150);
}

function getSpawnPos() {
  // 限制在路面宽度内
  const localX = rnd(-LIMIT_X * 0.9, LIMIT_X * 0.9);
  // 赛车游戏 Y 轴较低
  const localY = rnd(-1, 1);
  return { localX, localY };
}

function spawnObstacle(){
  const grp = makeDebris(); 
  const pos = getSpawnPos();
  const z = -150 - Math.random()*25;
  const center = getCurveOffset(z); 
  grp.position.set(center.x + pos.localX, pos.localY, z);
  scene.add(grp);
  const sphere = new THREE.Box3().setFromObject(grp).getBoundingSphere(new THREE.Sphere());
  obstacles.push({ mesh: grp, localX: pos.localX, localY: pos.localY, radius: Math.max(0.6, sphere.radius * 0.8), spin: { x: rnd(-0.9,0.9), y: rnd(-0.9,0.9), z: rnd(-0.6,0.6) } });
}

function spawnOrb(){
  const g = new THREE.Group(); g.add(new THREE.Mesh(orbGlowGeo, orbGlowMat)); const core = new THREE.Mesh(orbCoreGeo, orbCoreMat); g.add(core);
  const pos = getSpawnPos();
  const z = -150 - Math.random()*22;
  const center = getCurveOffset(z); g.position.set(center.x + pos.localX, pos.localY + 0.5, z);
  scene.add(g); orbs.push({ mesh:g, core, localX: pos.localX, localY: pos.localY + 0.5 });
}

function spawnPowerup(){
  const rand = Math.random();
  let type = 'shield';
  let mesh = new THREE.Mesh(puShieldGeo, puShieldMat);
  if (rand > 0.6) { type = 'weapon'; mesh = new THREE.Mesh(puWeaponGeo, puWeaponMat); }
  else if (rand > 0.9) { type = 'nuke'; mesh = new THREE.Mesh(puNukeGeo, puNukeMat); }
  
  const g = new THREE.Group();
  g.add(mesh);
  const glowMat = new THREE.MeshBasicMaterial({ color: mesh.material.color, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false });
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 12), glowMat));
  
  const pos = getSpawnPos();
  const z = -150 - Math.random()*22;
  const center = getCurveOffset(z); g.position.set(center.x + pos.localX, pos.localY + 0.5, z);
  scene.add(g); powerups.push({ mesh:g, core: mesh, type, localX: pos.localX, localY: pos.localY + 0.5 });
}

function spawnBoostPad(){
  const grp = makeBoostPad();
  const pos = getSpawnPos();
  const z = -150 - Math.random()*22;
  const center = getCurveOffset(z); 
  // 平贴在路面上
  grp.position.set(center.x + pos.localX, -0.4, z);
  scene.add(grp); 
  boostPads.push({ mesh: grp, localX: pos.localX, localY: -0.4 });
}

function spawnWave(){
  const t = Math.min(1, state.elapsed / 80);
  const count = 2 + Math.round(Math.random() * (1 + t * 3));
  for (let i = 0; i < count; i++) spawnObstacle();
  if (Math.random() < 0.4) spawnOrb();
  if (Math.random() < 0.2) spawnPowerup();
  if (Math.random() < 0.3) spawnBoostPad(); // 30%概率生成加速带
}

function spawnLogic(){
  if (state.traveled < state.nextSpawn) return;
  const t = Math.min(1, state.elapsed / 80);
  const interval = 0.9 - 0.4 * t;
  state.nextSpawn = state.traveled + state.speed * interval;
  spawnWave();
}

function updateShip(dt){
  let dirX = 0, dirY = 0;
  if (keys.has('a') || keys.has('arrowleft'))  dirX -= 1;
  if (keys.has('d') || keys.has('arrowright')) dirX += 1;
  if (keys.has('w') || keys.has('arrowup'))    dirY += 1;
  if (keys.has('s') || keys.has('arrowdown'))  dirY -= 1;
  
  if (dirX || dirY){ 
    state.shipX += dirX * 20 * dt; 
    state.shipY += dirY * 10 * dt; 
    pointerTargetX = state.shipX; pointerTargetY = state.shipY; 
  } else if (pointerActive){ 
    const k = damp(15, dt); 
    state.shipX += (pointerTargetX - state.shipX) * k; 
    state.shipY += (pointerTargetY - state.shipY) * k; 
  }
  
  state.shipX = clamp(state.shipX, -LIMIT_X, LIMIT_X); 
  state.shipY = clamp(state.shipY, -LIMIT_Y, LIMIT_Y);
  
  const vx = (state.shipX - prevShipX) / Math.max(dt, 1e-4); 
  const k = damp(10, dt);
  
  // 赛车转向倾斜
  car.rotation.z += (-vx * 0.04 - car.rotation.z) * k; 
  car.rotation.y += (-vx * 0.02 - car.rotation.y) * k; 
  
  prevShipX = state.shipX; 
  prevShipY = state.shipY;
}

function updateWorld(dt){
  // 如果有加速带状态，速度翻倍
  let currentSpeed = state.speed;
  if (state.boostTimer > 0) {
    state.boostTimer -= dt;
    currentSpeed *= 1.8;
    puBoost.style.display = 'flex';
    powerupHud.classList.add('active');
    if (state.boostTimer <= 0) {
      puBoost.style.display = 'none';
    }
  }

  const dz = currentSpeed * dt;
  const time = performance.now() * 0.001;

  // 更新两侧光柱
  pillars.forEach(p => {
    p.z += dz;
    if (p.z > 10) {
      p.z -= 800; // 重新循环
      p.xOffset = Math.random() > 0.5 ? -15 : 15;
    }
    const z = p.z;
    const center = getCurveOffset(z);
    p.mesh.position.set(center.x + p.xOffset, 10, z);
  });

  // 速度表UI更新
  speedHud.innerHTML = `${Math.floor(currentSpeed * 3.6)} <span class="unit">km/h</span>`;
  if (state.mode === 'playing') speedHud.classList.add('active');

  // 更新道具计时器
  if (state.shieldTimer > 0) {
    state.shieldTimer -= dt;
    shieldTimeEl.innerText = Math.ceil(state.shieldTimer);
    shieldMesh.visible = true;
    shieldMesh.rotation.y += 2 * dt;
    if (state.shieldTimer <= 0) { shieldMesh.visible = false; puShield.style.display = 'none'; }
    else { puShield.style.display = 'flex'; powerupHud.classList.add('active'); }
  }
  if (state.weaponTimer > 0) {
    state.weaponTimer -= dt;
    weaponTimeEl.innerText = Math.ceil(state.weaponTimer);
    if (state.weaponTimer <= 0) { puWeapon.style.display = 'none'; }
    else { puWeapon.style.display = 'flex'; powerupHud.classList.add('active'); }
    
    // 自动开火
    if (Math.floor(state.weaponTimer * 10) % 2 === 0) {
      if (!state.lastShoot || time - state.lastShoot > 0.12) {
        state.lastShoot = time;
        const b = new THREE.Mesh(bulletGeo, bulletMat);
        const offset0 = getCurveOffset(0);
        const T = getTangent(0);
        const up = new THREE.Vector3(0,1,0); const right = new THREE.Vector3().crossVectors(T, up).normalize(); 
        const startPos = new THREE.Vector3(offset0.x, state.shipY + 0.4, 0).add(right.clone().multiplyScalar(state.shipX)).add(T.clone().multiplyScalar(2));
        b.position.copy(startPos);
        b.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), T);
        scene.add(b);
        bullets.push({ mesh: b, localX: state.shipX, localY: state.shipY + 0.4 });
        Sound.shoot();
      }
    }
  }
  if (state.shieldTimer <= 0 && state.weaponTimer <= 0 && state.boostTimer <= 0) {
    powerupHud.classList.remove('active');
  }

  // --- 加速带更新与碰撞 ---
  for (let i = boostPads.length - 1; i >= 0; i--) {
    const o = boostPads[i];
    o.mesh.position.z += dz;
    const z = o.mesh.position.z;
    const center = getCurveOffset(z);
    o.mesh.position.x = center.x + o.localX;

    if (state.mode === 'playing' && z > -3 && z < 3) {
      if (Math.hypot(o.localX - state.shipX, o.localY - state.shipY) < 2.5) {
        // 吃到加速带！
        state.boostTimer = 1.5; 
        triggerShake(0.4, 0.8);
        Sound.boost();
        showToast('氮气加速！', '#3ee8ff');
        scene.remove(o.mesh); boostPads.splice(i, 1); continue;
      }
    }
    if (z > 16) { scene.remove(o.mesh); boostPads.splice(i, 1); }
  }

  // 子弹更新
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.z -= 250 * dt; 
    const z = b.mesh.position.z;
    if (z < -200) { scene.remove(b.mesh); bullets.splice(i, 1); continue; }
    
    const center = getCurveOffset(z);
    const T = getTangent(z);
    const up = new THREE.Vector3(0,1,0); const right = new THREE.Vector3().crossVectors(T, up).normalize(); 
    b.mesh.position.copy(new THREE.Vector3(center.x, b.localY, z).add(right.clone().multiplyScalar(b.localX)));
    
    for (let j = obstacles.length - 1; j >= 0; j--) {
      const o = obstacles[j];
      if (Math.abs(o.mesh.position.z - z) < 3.5) {
        if (Math.hypot(o.localX - b.localX, o.localY - b.localY) < o.radius + 0.6) {
          createExplosion(o.mesh.position);
          scene.remove(o.mesh); obstacles.splice(j, 1);
          scene.remove(b.mesh); bullets.splice(i, 1);
          Sound.explode();
          triggerShake(0.15, 0.3); 
          triggerHitStop(0.03);     
          break;
        }
      }
    }
  }

  // 障碍物更新
  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    o.mesh.position.z += dz;
    const z = o.mesh.position.z; const center = getCurveOffset(z); const T = getTangent(z);
    const up = new THREE.Vector3(0, 1, 0); const right = new THREE.Vector3().crossVectors(T, up).normalize(); 
    o.mesh.position.copy(new THREE.Vector3(center.x, o.localY, z).add(right.clone().multiplyScalar(o.localX)));
    o.mesh.rotation.x += o.spin.x * dt; o.mesh.rotation.y += o.spin.y * dt; o.mesh.rotation.z += o.spin.z * dt;

    if (state.mode === 'playing' && z > -2.0 && z < 2.0){
      if (Math.hypot(o.localX - state.shipX, o.localY - state.shipY) < o.radius + 0.6) {
        if (state.shieldTimer > 0) {
          createExplosion(o.mesh.position);
          scene.remove(o.mesh); obstacles.splice(i, 1);
          Sound.explode();
          triggerShake(0.2, 0.5); 
        } else if (state.boostTimer > 0) {
          // 加速状态下撞毁路障
          createExplosion(o.mesh.position);
          scene.remove(o.mesh); obstacles.splice(i, 1);
          Sound.explode();
          triggerShake(0.2, 0.5); 
        } else {
          crash();
        }
      }
    }
    if (o.mesh.position.z > 16){ scene.remove(o.mesh); obstacles.splice(i, 1); }
  }

  // 能量球更新
  for (let i = orbs.length - 1; i >= 0; i--){
    const o = orbs[i]; 
    o.mesh.position.z += dz;
    const z = o.mesh.position.z; const center = getCurveOffset(z); const T = getTangent(z);
    const up = new THREE.Vector3(0, 1, 0); const right = new THREE.Vector3().crossVectors(T, up).normalize(); 
    o.mesh.position.copy(new THREE.Vector3(center.x, o.localY, z).add(right.clone().multiplyScalar(o.localX)));
    o.core.rotation.x += 2.2 * dt; o.core.rotation.y += 3.0 * dt;

    if (state.mode === 'playing' && z > -2.5 && z < 2.5){
      if (Math.hypot(o.localX - state.shipX, o.localY - state.shipY) < 1.8){
        state.score += 50; Sound.pickup(); scene.remove(o.mesh); orbs.splice(i, 1); 
        popScore();
        continue;
      }
    }
    if (o.mesh.position.z > 16){ scene.remove(o.mesh); orbs.splice(i, 1); }
  }

  // 道具更新
  for (let i = powerups.length - 1; i >= 0; i--){
    const o = powerups[i];
    o.mesh.position.z += dz;
    const z = o.mesh.position.z; const center = getCurveOffset(z); const T = getTangent(z);
    const up = new THREE.Vector3(0, 1, 0); const right = new THREE.Vector3().crossVectors(T, up).normalize(); 
    o.mesh.position.copy(new THREE.Vector3(center.x, o.localY, z).add(right.clone().multiplyScalar(o.localX)));
    o.core.rotation.x += 2.0 * dt; o.core.rotation.y += 2.5 * dt;

    if (state.mode === 'playing' && z > -2.5 && z < 2.5){
      if (Math.hypot(o.localX - state.shipX, o.localY - state.shipY) < 1.8){
        if (o.type === 'shield') {
          state.shieldTimer = 6.0;
          showToast('护盾激活', '#4da6ff');
          Sound.powerup('shield');
        } else if (o.type === 'weapon') {
          state.weaponTimer = 8.0;
          showToast('武器系统上线', '#ff4d4d');
          Sound.powerup('weapon');
        } else if (o.type === 'nuke') {
          showToast('全屏消除！', '#b066ff');
          Sound.powerup('nuke');
          
          triggerShake(0.8, 1.5); 
          triggerHitStop(0.1);
          nukeFlashEl.style.opacity = '0.8';
          setTimeout(() => nukeFlashEl.style.opacity = '0', 100);

          for (let j = obstacles.length - 1; j >= 0; j--) {
            createExplosion(obstacles[j].mesh.position);
            scene.remove(obstacles[j].mesh);
          }
          obstacles.length = 0;
        }
        scene.remove(o.mesh); powerups.splice(i, 1); continue;
      }
    }
    if (o.mesh.position.z > 16){ scene.remove(o.mesh); powerups.splice(i, 1); }
  }
}

function updateCamera(dt){
  const offset0 = getCurveOffset(0); const T = getTangent(0);
  const up = new THREE.Vector3(0, 1, 0); const right = new THREE.Vector3().crossVectors(T, up).normalize();
  
  // 赛车位置
  const shipWorld = new THREE.Vector3(offset0.x, state.shipY, 0).add(right.clone().multiplyScalar(state.shipX));
  carPivot.position.copy(shipWorld); 
  carPivot.lookAt(shipWorld.clone().add(T)); 
  
  // 摄像机贴地跟随
  const camOffset = T.clone().multiplyScalar(-16); 
  const camUpOffset = new THREE.Vector3(0, 3.5, 0); // 贴近地面的高度
  
  let camPos = new THREE.Vector3(offset0.x, 0, 0).add(camOffset).add(camUpOffset);
  
  // 速度越快，视野越广
  let targetFov = BASE_FOV + (state.speed / state.maxSpeed) * 15;
  if (state.boostTimer > 0) targetFov += 15; // 加速时视野进一步扩大
  
  camera.fov += (targetFov - camera.fov) * 0.1;
  camera.updateProjectionMatrix();

  if (shakeTime > 0) {
    shakeTime -= dt;
    camPos.x += (Math.random() - 0.5) * shakeIntensity;
    camPos.y += (Math.random() - 0.5) * shakeIntensity;
    shakeIntensity *= 0.9;
  }

  camera.position.copy(camPos);
  camera.lookAt(new THREE.Vector3(offset0.x, state.shipY * 0.5, 0).add(T.clone().multiplyScalar(30)));
}

/* 爆炸粒子 */
const explosions = [];
function createExplosion(pos){
  const N = 30; const positions = new Float32Array(N * 3); const vels = [];
  for (let i = 0; i < N; i++){
    positions[i*3] = pos.x; positions[i*3+1] = pos.y; positions[i*3+2] = pos.z;
    const v = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(3 + Math.random()*15);
    vels.push(v);
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color:0xffb04d, size:0.55, transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending }));
  scene.add(pts);
  explosions.push({ points: pts, vels, life: 1.0 });
}
function updateParticles(dt){
  for (let i = explosions.length - 1; i >= 0; i--){
    const ex = explosions[i];
    ex.life -= dt;
    if (ex.life <= 0) { scene.remove(ex.points); ex.points.geometry.dispose(); ex.points.material.dispose(); explosions.splice(i, 1); continue; }
    const pos = ex.points.geometry.attributes.position; const drag = 1 - 2.2 * dt;
    for (let j = 0; j < ex.vels.length; j++){ const v = ex.vels[j]; pos.array[j*3] += v.x * dt; pos.array[j*3+1] += v.y * dt; pos.array[j*3+2] += v.z * dt; v.multiplyScalar(drag); }
    pos.needsUpdate = true; ex.points.material.opacity = Math.max(0, ex.life);
  }
}

function resetScene(){
  for (const o of obstacles) scene.remove(o.mesh); obstacles.length = 0;
  for (const o of orbs) scene.remove(o.mesh); orbs.length = 0;
  for (const o of powerups) scene.remove(o.mesh); powerups.length = 0;
  for (const o of bullets) scene.remove(o.mesh); bullets.length = 0;
  for (const o of boostPads) scene.remove(o.mesh); boostPads.length = 0;
  for (const o of explosions) scene.remove(o.points); explosions.length = 0;

  carPivot.visible = true; carPivot.position.set(0, 0, 0); carPivot.rotation.set(0, 0, 0); car.rotation.set(0, 0, 0);
  state.shipX = 0; state.shipY = 0; prevShipX = 0; prevShipY = 0; pointerTargetX = 0; pointerTargetY = 0; pointerActive = false;
  state.shieldTimer = 0; state.weaponTimer = 0; state.boostTimer = 0; shieldMesh.visible = false;
  puShield.style.display = 'none'; puWeapon.style.display = 'none'; puBoost.style.display = 'none'; powerupHud.classList.remove('active');
  
  camera.fov = BASE_FOV; camera.updateProjectionMatrix();
  speedHud.classList.remove('active');
}

function startGame(){
  Sound.init(); 
  Sound.playBGM(); 
  
  state.mode = 'playing'; state.elapsed = 0; state.speed = state.baseSpeed; state.traveled = 0; state.nextSpawn = 45; state.score = 0;
  resetScene();
  scoreEl.textContent = '0'; bestEl.textContent = state.best;
  hudEl.style.display = 'flex'; startScreen.classList.add('hidden'); overScreen.classList.add('hidden'); rewardModal.classList.add('hidden');
}

function exitToMenu(){
  state.mode = 'ready'; resetScene(); Sound.stopBGM(); overScreen.classList.add('hidden'); rewardModal.classList.add('hidden'); hudEl.style.display = 'none'; startScreen.classList.remove('hidden');
}

function crash(){
  if (state.mode !== 'playing') return;
  state.mode = 'over'; carPivot.visible = false;
  
  Sound.stopBGM(); 
  
  triggerShake(1.5, 3.0); 
  triggerHitStop(0.15);    
  
  createExplosion(carPivot.position); Sound.explode();
  flashEl.style.opacity = '0.9'; setTimeout(() => { flashEl.style.opacity = '0'; }, 150);
  
  const finalScore = Math.floor(state.score);
  if (finalScore > state.best){ state.best = finalScore; localStorage.setItem('racerunner_best', String(state.best)); }
  setTimeout(() => {
    finalScoreEl.textContent = finalScore; finalBestEl.textContent = '最高分 ' + state.best;
    overScreen.classList.remove('hidden'); hudEl.style.display = 'none';
  }, 950);
}

/* 赞赏功能 */
function spawnHearts() {
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div'); el.className = 'heart-particle';
    el.innerText = ['❤️', '💖', '✨', '🌟'][Math.floor(Math.random() * 4)];
    const startX = Math.random() * 100; const delay = Math.random() * 1.5; const duration = 2 + Math.random() * 2; const size = 16 + Math.random() * 24;
    el.style.left = `${startX}vw`; el.style.top = `-50px`; el.style.fontSize = `${size}px`; el.style.animation = `fall ${duration}s linear ${delay}s forwards`;
    document.body.appendChild(el); setTimeout(() => { el.remove(); }, (duration + delay) * 1000);
  }
}
function showReward() { Sound.init(); if (state.mode !== 'playing') Sound.fadeBGM(0.1, 0.5); rewardModal.classList.remove('hidden'); spawnHearts(); }
function closeReward() { rewardModal.classList.add('hidden'); if (state.mode !== 'playing') Sound.fadeBGM(0.25, 0.5); }

document.getElementById('rewardBtn').addEventListener('click', showReward);
document.getElementById('rewardBtn2').addEventListener('click', showReward);
document.getElementById('closeRewardBtn').addEventListener('click', closeReward);
document.getElementById('qrContainer').addEventListener('click', closeReward);
rewardModal.addEventListener('click', (e) => { if (e.target === rewardModal) closeReward(); });

/* 主循环 */
const clock = new THREE.Clock();
function update(dt){
  if (hitStopTime > 0) {
    hitStopTime -= dt;
    return; 
  }

  const time = performance.now() * 0.001;
  if (state.mode === 'playing'){
    state.elapsed += dt;
    const t = 1 - Math.exp(-state.elapsed / 45);
    state.speed = state.baseSpeed + (state.maxSpeed - state.baseSpeed) * t;
    state.traveled += state.speed * dt; 
    updateShip(dt); spawnLogic();
    
    // 分数随车速增加
    state.score += state.speed * dt * 0.35; 
    scoreEl.textContent = Math.floor(state.score);
  } else if (state.mode === 'ready'){
    // 待机时赛车在原地
    const offset0 = getCurveOffset(0); 
    carPivot.position.set(offset0.x, 0, 0);
    car.position.y = Math.sin(time * 5) * 0.05; // 引擎怠速震动
  }
  
  updateWorld(dt); updateParticles(dt);
  
  if (state.mode !== 'over') { updateCamera(dt); } else { camera.position.z += dt * 2; }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt); renderer.render(scene, camera);
}

/* 输入 */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys.add(k);
  if (k === ' ' && state.mode !== 'playing' && rewardModal.classList.contains('hidden')) startGame();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

addEventListener('mousemove', e => {
  if (state.mode !== 'playing') return;
  const nx = (e.clientX / innerWidth) * 2 - 1; const ny = -((e.clientY / innerHeight) * 2 - 1);
  pointerTargetX = nx * LIMIT_X; pointerTargetY = ny * LIMIT_Y; pointerActive = true;
});

let touchId = null, lastTX = 0, lastTY = 0;
addEventListener('touchstart', e => {
  if (state.mode !== 'playing') return;
  const t = e.changedTouches[0]; touchId = t.identifier; lastTX = t.clientX; lastTY = t.clientY;
}, { passive:true });
addEventListener('touchmove', e => {
  if (state.mode !== 'playing' || touchId === null) return;
  for (const t of e.changedTouches){
    if (t.identifier !== touchId) continue;
    const dx = t.clientX - lastTX; const dy = t.clientY - lastTY; lastTX = t.clientX; lastTY = t.clientY;
    pointerTargetX = clamp(pointerTargetX + dx * 0.08, -LIMIT_X, LIMIT_X);
    pointerTargetY = clamp(pointerTargetY - dy * 0.08, -LIMIT_Y, LIMIT_Y);
    pointerActive = true;
  }
  e.preventDefault();
}, { passive:false });
addEventListener('touchend', e => { for (const t of e.changedTouches){ if (t.identifier === touchId) touchId = null; } }, { passive:true });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('exitBtn').addEventListener('click', exitToMenu);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

bestEl.textContent = state.best;
animate();
</script>
