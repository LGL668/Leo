<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>实时股票行情看板 - 移动适配版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            padding: 12px; /* 缩小全局内边距 */
        }
        
        /* 容器改为百分百宽度，并限制最大宽度在 PC 端居中 */
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        
        h1 { font-size: 1.4rem; margin-bottom: 16px; font-weight: 500; color: #e6edf3; border-bottom: 1px solid #30363d; padding-bottom: 10px; }

        /* 搜索区域 */
        .search-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; position: relative; align-items: center; }
        .search-bar input { flex: 1; min-width: 150px; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .search-bar input:focus { border-color: #58a6ff; }
        .search-bar button { padding: 8px 16px; border-radius: 6px; border: none; background: #238636; color: #fff; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        .search-bar button:hover { background: #2ea043; }
        .search-bar button:disabled { opacity: 0.6; cursor: not-allowed; }

        .refresh-config { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: #8b949e; white-space: nowrap; }
        .refresh-config select { padding: 7px 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 0.85rem; outline: none; cursor: pointer; }

        /* 候选下拉框 */
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; z-index: 100; background: #1c2128; border: 1px solid #30363d; border-top: none; border-radius: 0 0 8px 8px; max-height: 240px; overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .suggestion-item { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; transition: background 0.15s; }
        .suggestion-item:hover { background: #30363d; }
        .suggestion-item .s-name { font-weight: 500; color: #e6edf3; }
        .suggestion-item .s-code { color: #8b949e; font-size: 0.8rem; margin-left: 8px; }
        .suggestion-item .s-market { color: #58a6ff; font-size: 0.75rem; margin-left: 6px; }

        /* 自选股标签栏 */
        .watchlist-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; white-space: nowrap; scrollbar-width: none; }
        .watchlist-bar::-webkit-scrollbar { display: none; }
        
        .watch-item { display: inline-flex; align-items: center; background: #161b22; border: 1px solid #30363d; padding: 4px 10px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; user-select: none; }
        .watch-item:hover { background: #21262d; border-color: #8b949e; }
        .watch-item.active { background: #1f6feb22; border-color: #58a6ff; color: #58a6ff; }
        .watch-item .w-name { font-weight: 500; margin-right: 4px; }
        .watch-item .w-code { color: #8b949e; font-size: 0.7rem; }
        .watch-item .w-del { margin-left: 6px; color: #484f58; font-weight: bold; cursor: pointer; padding: 0 4px; border-radius: 50%; transition: color 0.2s, background 0.2s; }
        .watch-item .w-del:hover { color: #f85149; background: #30363d; }
        .watch-empty { color: #8b949e; font-size: 0.8rem; padding: 4px 0; }

        .status { font-size: 0.8rem; color: #8b949e; margin-bottom: 12px; min-height: 18px; }
        .status.error { color: #f85149; }

        /* 报价卡片 */
        .quote-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: none; }
        .quote-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
        .stock-title { display: flex; align-items: center; gap: 8px; }
        .stock-name { font-size: 1.2rem; font-weight: 600; color: #e6edf3; }
        .stock-code { font-size: 0.8rem; color: #8b949e; }
        
        .star-btn { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 2px; }
        .star-btn:hover { border-color: #d29922; color: #d29922; }
        .star-btn.starred { border-color: #d29922; color: #d29922; background: #d299221a; }
        .star-btn.starred:hover { background: #d2992233; }

        .price-block { text-align: right; }
        .current-price { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .change { font-size: 0.85rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .up { color: #f85149; }
        .down { color: #3fb950; }
        .flat { color: #8b949e; }

        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #30363d; }
        .meta-item { display: flex; flex-direction: column; gap: 2px; }
        .meta-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .meta-value { font-size: 0.85rem; font-variant-numeric: tabular-nums; }

        /* === 持仓盈亏面板 === */
        .portfolio-panel { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #30363d; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
        .portfolio-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.7rem; color: #8b949e; }
        .input-group input { width: 90px; padding: 6px 8px; border-radius: 4px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 0.85rem; outline: none; transition: border-color 0.2s; }
        .input-group input:focus { border-color: #58a6ff; }
        
        .portfolio-results { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; text-align: right; }
        .p-result-item { display: flex; flex-direction: column; gap: 2px; }
        .p-result-label { font-size: 0.7rem; color: #8b949e; }
        .p-result-value { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .p-result-value.amount { font-size: 1.1rem; }

        /* 图表容器 */
        .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 8px; margin-bottom: 16px; display: none; }
        .chart-container h2 { font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; padding-left: 4px; color: #e6edf3; display: flex; justify-content: space-between; align-items: center; }
        
        /* 图表框默认高度，手机端横屏时通过媒体查询大幅降低，以适应屏幕高度 */
        .chart-box { width: 100%; height: 380px; }

        .footer { margin-top: 16px; font-size: 0.7rem; color: #484f58; text-align: center; line-height: 1.4; }
        .footer a { color: #58a6ff; text-decoration: none; }

        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 4px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .pulse-dot { display: inline-block; width: 6px; height: 6px; background-color: #3fb950; border-radius: 50%; margin-right: 4px; box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(63, 185, 80, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); } }

        /* ========================================================= */
        /* 🌟 核心响应式：针对手机横屏（高度较小的设备）做特殊优化 */
        /* ========================================================= */
        @media (max-width: 850px), (orientation: landscape) and (max-height: 500px) {
            body { padding: 6px; }
            h1 { display: none; } /* 移动端隐藏主标题节约空间 */
            
            .search-bar { flex-wrap: nowrap; gap: 4px; }
            .search-bar input { padding: 6px 8px; font-size: 0.85rem; }
            .search-bar button { padding: 6px 10px; font-size: 0.85rem; }
            .refresh-config span { display: none; } /* 隐藏文字，只留下拉框 */
            .refresh-config select { padding: 6px; font-size: 0.85rem; }

            .quote-card { padding: 10px; margin-bottom: 8px; }
            .current-price { font-size: 1.4rem; }
            .meta-grid { grid-template-columns: repeat(3, 1fr); margin-top: 8px; padding-top: 8px; }
            
            .portfolio-panel { flex-direction: column; align-items: stretch; gap: 8px; margin-top: 8px; padding-top: 8px; }
            .portfolio-inputs { justify-content: space-between; }
            .input-group { flex: 1; }
            .input-group input { width: 100%; }
            .portfolio-results { justify-content: space-between; margin-left: 0; text-align: left; gap: 8px; }

            /* 横屏时，图表高度自适应，避免一屏放不下 */
            .chart-box { height: 260px; } 
            .chart-container { padding: 4px; margin-bottom: 8px; }
        }
        
        /* 极端横屏：让两个图表并排显示，完美利用宽屏优势 */
        @media (orientation: landscape) and (max-height: 500px) and (min-width: 650px) {
            .chart-wrapper-group { display: flex; gap: 8px; width: 100%; }
            .chart-container { flex: 1; width: 50%; margin-bottom: 8px; }
            .chart-box { height: 240px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 实时股票行情看板</h1>

    <!-- 搜索和设置 -->
    <div class="search-bar">
        <input type="text" id="codeInput" placeholder="代码或名称，如 600519" autocomplete="off">
        <button id="searchBtn">查询</button>
        <div class="refresh-config">
            <span>刷新：</span>
            <select id="refreshRate">
                <option value="1000">1秒</option>
                <option value="2000">2秒</option>
                <option value="3000" selected>3秒</option>
                <option value="5000">5秒</option>
            </select>
        </div>
        <div class="suggestions" id="suggestions"></div>
    </div>

    <!-- 自选股标签栏 -->
    <div class="watchlist-bar" id="watchlistBar"></div>
    
    <div class="status" id="status"></div>

    <!-- 报价卡片 -->
    <div class="quote-card" id="quoteCard">
        <div class="quote-header">
            <div class="stock-title">
                <div>
                    <span class="stock-name" id="stockName">--</span>
                    <span class="stock-code" id="stockCode"></span>
                </div>
                <button class="star-btn" id="starBtn" title="添加/取消自选">
                    <span id="starIcon">☆</span> <span id="starText">自选</span>
                </button>
            </div>
            <div class="price-block">
                <div class="current-price" id="currentPrice">--</div>
                <div class="change" id="changeInfo"></div>
            </div>
        </div>
        <div class="meta-grid">
            <div class="meta-item"><span class="meta-label">今开</span><span class="meta-value" id="open">--</span></div>
            <div class="meta-item"><span class="meta-label">昨收</span><span class="meta-value" id="prevClose">--</span></div>
            <div class="meta-item"><span class="meta-label">最高</span><span class="meta-value" id="high">--</span></div>
            <div class="meta-item"><span class="meta-label">最低</span><span class="meta-value" id="low">--</span></div>
            <div class="meta-item"><span class="meta-label">成交量</span><span class="meta-value" id="volume">--</span></div>
            <div class="meta-item"><span class="meta-label">成交额</span><span class="meta-value" id="amount">--</span></div>
        </div>

        <!-- 持仓盈亏面板 -->
        <div class="portfolio-panel">
            <div class="portfolio-inputs">
                <div class="input-group">
                    <label>成本价 (¥)</label>
                    <input type="number" id="buyPriceInput" placeholder="如: 10.50" step="0.01" min="0">
                </div>
                <div class="input-group">
                    <label>数量 (股)</label>
                    <input type="number" id="buyAmountInput" placeholder="如: 1000" step="100" min="0">
                </div>
            </div>
            <div class="portfolio-results" id="portfolioResults">
                <div class="p-result-item">
                    <span class="p-result-label">总成本</span>
                    <span class="p-result-value" id="totalCost">--</span>
                </div>
                <div class="p-result-item">
                    <span class="p-result-label">市值</span>
                    <span class="p-result-value" id="marketValue">--</span>
                </div>
                <div class="p-result-item">
                    <span class="p-result-label">盈亏额</span>
                    <span class="p-result-value amount" id="profitAmount">--</span>
                </div>
                <div class="p-result-item">
                    <span class="p-result-label">盈亏率</span>
                    <span class="p-result-value" id="profitPercent">--</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 图表组（用于横屏并排显示） -->
    <div class="chart-wrapper-group">
        <!-- 历史日K线 -->
        <div class="chart-container" id="historyChartBox">
            <h2>📜 历史日K线</h2>
            <div class="chart-box" id="historyChart"></div>
        </div>

        <!-- 今日分时走势 -->
        <div class="chart-container" id="timelineChartBox">
            <h2>
                <span>📈 分时走势</span>
                <span id="liveIndicator" style="display:none; font-size:0.75rem; font-weight:normal; color:#8b949e;">
                    <span class="pulse-dot"></span>实时
                </span>
            </h2>
            <div class="chart-box" id="timelineChart"></div>
        </div>
    </div>

    <div class="footer">
        数据：腾讯/东财（<a href="https://stock-sdk.linkdiary.cn/" target="_blank">stock-sdk</a>）<br>
        数据可能有延迟，仅供参考，不构成投资建议。
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script type="module">
    import { StockSDK } from 'https://unpkg.com/stock-sdk@1.10.1/dist/index.js';

    const sdk = new StockSDK();
    
    // DOM 获取略...
    const codeInput = document.getElementById('codeInput');
    const searchBtn = document.getElementById('searchBtn');
    const refreshRateSelect = document.getElementById('refreshRate');
    const suggestionsEl = document.getElementById('suggestions');
    const watchlistBar = document.getElementById('watchlistBar');
    const statusEl = document.getElementById('status');
    const quoteCard = document.getElementById('quoteCard');
    const starBtn = document.getElementById('starBtn');
    const starIcon = document.getElementById('starIcon');
    const starText = document.getElementById('starText');
    const buyPriceInput = document.getElementById('buyPriceInput');
    const buyAmountInput = document.getElementById('buyAmountInput');
    const totalCostEl = document.getElementById('totalCost');
    const marketValueEl = document.getElementById('marketValue');
    const profitAmountEl = document.getElementById('profitAmount');
    const profitPercentEl = document.getElementById('profitPercent');
    const historyChartBox = document.getElementById('historyChartBox');
    const timelineChartBox = document.getElementById('timelineChartBox');
    const liveIndicator = document.getElementById('liveIndicator');

    let currentCode = 'sh600519';
    let currentStockName = '贵州茅台';
    let currentPriceVal = 0;
    let refreshTimer = null;
    let suggestionItems = [];
    let currentInterval = parseInt(refreshRateSelect.value, 10);
    let fetchSeq = 0;
    let historyChart = null;
    let timelineChart = null;

    // 存储逻辑省略...
    const WATCHLIST_KEY = 'stock_watchlist';
    const PORTFOLIO_KEY = 'stock_portfolio';
    function getWatchlist() { try { return JSON.parse(localStorage.getItem(WATCHLIST_KEY)) || []; } catch { return []; } }
    function saveWatchlist(list) { localStorage.setItem(WATCHLIST_KEY, JSON.stringify(list)); }
    function isInWatchlist(code) { return getWatchlist().some(item => item.code === code); }
    function toggleWatchlist(code, name) {
        let list = getWatchlist();
        const index = list.findIndex(item => item.code === code);
        if (index >= 0) list.splice(index, 1); else list.push({ code, name }); 
        saveWatchlist(list); renderWatchlist(); updateStarBtnState(code);
    }
    function getPortfolioData() { try { return JSON.parse(localStorage.getItem(PORTFOLIO_KEY)) || {}; } catch { return {}; } }
    function getStockPortfolio(code) { const data = getPortfolioData(); return data[code] || { buyPrice: '', buyAmount: '' }; }
    function saveStockPortfolio(code, buyPrice, buyAmount) {
        const data = getPortfolioData();
        if (!buyPrice && !buyAmount) delete data[code]; else data[code] = { buyPrice, buyAmount };
        localStorage.setItem(PORTFOLIO_KEY, JSON.stringify(data));
    }

    function updatePortfolioCalc() {
        const buyPrice = parseFloat(buyPriceInput.value);
        const buyAmount = parseInt(buyAmountInput.value, 10);
        const curPrice = currentPriceVal;
        if (!buyPrice || !buyAmount || !curPrice || isNaN(buyPrice) || isNaN(buyAmount)) {
            totalCostEl.textContent = '--'; marketValueEl.textContent = '--';
            profitAmountEl.textContent = '--'; profitPercentEl.textContent = '--';
            profitAmountEl.className = 'p-result-value amount';
            profitPercentEl.className = 'p-result-value';
            return;
        }
        const totalCost = buyPrice * buyAmount;
        const marketValue = curPrice * buyAmount;
        const profitAmount = marketValue - totalCost;
        const profitPercent = (profitAmount / totalCost) * 100;
        
        // 移动端显示更紧凑，避免超出宽度
        totalCostEl.textContent = `¥${(totalCost/1000).toFixed(1)}k`;
        marketValueEl.textContent = `¥${(marketValue/1000).toFixed(1)}k`;
        const sign = profitAmount > 0 ? '+' : '';
        profitAmountEl.textContent = `${sign}${profitAmount.toFixed(0)}`;
        profitPercentEl.textContent = `${sign}${profitPercent.toFixed(2)}%`;
        const colorClass = profitAmount > 0 ? 'up' : (profitAmount < 0 ? 'down' : 'flat');
        profitAmountEl.className = `p-result-value amount ${colorClass}`;
        profitPercentEl.className = `p-result-value ${colorClass}`;
    }

    [buyPriceInput, buyAmountInput].forEach(input => {
        input.addEventListener('input', () => {
            saveStockPortfolio(currentCode, buyPriceInput.value, buyAmountInput.value);
            updatePortfolioCalc();
        });
    });
    function loadPortfolioToInputs(code) {
        const p = getStockPortfolio(code);
        buyPriceInput.value = p.buyPrice || ''; buyAmountInput.value = p.buyAmount || '';
        updatePortfolioCalc();
    }

    function renderWatchlist() {
        const list = getWatchlist();
        if (list.length === 0) {
            watchlistBar.innerHTML = '<div class="watch-empty">暂无自选，搜索后点击「自选」添加</div>'; return;
        }
        watchlistBar.innerHTML = list.map(item => `
            <div class="watch-item ${item.code === currentCode ? 'active' : ''}" data-code="${item.code}" data-name="${item.name}">
                <span class="w-name">${item.name}</span><span class="w-code">${item.code.toUpperCase()}</span>
                <span class="w-del" data-code="${item.code}">×</span>
            </div>`).join('');
        watchlistBar.querySelectorAll('.watch-item').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('w-del')) return;
                const code = el.dataset.code; const name = el.dataset.name;
                codeInput.value = name; stopAutoRefresh();
                refreshAll(code).then(() => { if (!refreshTimer) startAutoRefresh(); });
            });
        });
        watchlistBar.querySelectorAll('.w-del').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const code = el.dataset.code; const name = getWatchlist().find(i => i.code === code)?.name || '';
                toggleWatchlist(code, name);
            });
        });
    }

    function updateStarBtnState(code) {
        const starred = isInWatchlist(code);
        starBtn.classList.toggle('starred', starred);
        starIcon.textContent = starred ? '★' : '☆';
        starText.textContent = starred ? '已自选' : '自选';
    }

    const fmtPrice = (v) => (v == null || isNaN(v)) ? '--' : Number(v).toFixed(2);
    const fmtVolume = (v) => {
        if (v == null || isNaN(v)) return '--';
        const n = Number(v);
        if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
        if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
        return n.toString();
    };
    const fmtAmount = (v) => {
        if (v == null || isNaN(v)) return '--';
        const n = Number(v);
        if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
        if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
        return n.toFixed(2);
    };
    const setStatus = (msg, isError = false) => {
        statusEl.innerHTML = msg; statusEl.className = 'status' + (isError ? ' error' : '');
    };
    const applyColor = (el, value) => {
        el.classList.remove('up', 'down', 'flat');
        if (value > 0) el.classList.add('up');
        else if (value < 0) el.classList.add('down');
        else el.classList.add('flat');
    };
    function normalizeCode(code) {
        if (!code) return code;
        let c = String(code).trim();
        if (/^(sh|sz|bj|hk|us)/i.test(c)) return c.toLowerCase();
        if (/^\d{6}$/.test(c)) {
            if (c[0] === '6') return 'sh' + c;
            if (c[0] === '0' || c[0] === '3') return 'sz' + c;
            if (c[0] === '8' || c[0] === '4') return 'bj' + c;
        }
        if (/^\d{5}$/.test(c)) return 'hk' + c;
        if (/^[a-z]+$/i.test(c)) return c.toLowerCase();
        return c;
    }

    async function searchStocks(keyword) {
        const results = await sdk.search(keyword);
        if (!results || results.length === 0) return [];
        return results.filter(r => !r.category || r.category.toLowerCase() === 'stock');
    }
    function renderSuggestions(results) {
        suggestionItems = results;
        if (results.length === 0) { suggestionsEl.style.display = 'none'; return; }
        suggestionsEl.innerHTML = results.map((r, i) => `
            <div class="suggestion-item" data-index="${i}">
                <span><span class="s-name">${r.name || '--'}</span><span class="s-code">${r.code || ''}</span></span>
                <span class="s-market">${(r.market || '').toUpperCase()}</span>
            </div>`).join('');
        suggestionsEl.style.display = 'block';
        suggestionsEl.querySelectorAll('.suggestion-item').forEach(el => {
            el.addEventListener('click', () => selectSuggestion(Number(el.dataset.index)));
        });
    }
    function hideSuggestions() { suggestionsEl.style.display = 'none'; }
    function selectSuggestion(index) {
        const item = suggestionItems[index];
        if (!item) return;
        hideSuggestions(); codeInput.value = item.name || item.code;
        stopAutoRefresh(); refreshAll(item.code).then(() => startAutoRefresh());
    }

    async function fetchQuote(code, seq) {
        const quotes = await sdk.getSimpleQuotes([code]);
        if (seq !== fetchSeq) return;
        if (!quotes || quotes.length === 0) throw new Error(`未找到代码 “${code}” 的行情数据`);
        const q = quotes[0];
        currentStockName = q.name || code;
        currentPriceVal = q.price || 0;

        document.getElementById('stockName').textContent = currentStockName;
        document.getElementById('stockCode').textContent = q.code || code;
        document.getElementById('currentPrice').textContent = fmtPrice(q.price);
        const change = q.change ?? (q.price - q.prevClose);
        const changePct = q.changePercent ?? (change / q.prevClose * 100);
        const changeEl = document.getElementById('changeInfo');
        const sign = change > 0 ? '+' : '';
        changeEl.textContent = `${sign}${fmtPrice(change)} (${sign}${(changePct || 0).toFixed(2)}%)`;
        applyColor(changeEl, change); applyColor(document.getElementById('currentPrice'), change);

        document.getElementById('open').textContent = fmtPrice(q.open);
        document.getElementById('prevClose').textContent = fmtPrice(q.prevClose);
        document.getElementById('high').textContent = fmtPrice(q.high);
        document.getElementById('low').textContent = fmtPrice(q.low);
        document.getElementById('volume').textContent = fmtVolume(q.volume);
        document.getElementById('amount').textContent = fmtAmount(q.amount);

        quoteCard.style.display = 'block';
        updateStarBtnState(code);
        updatePortfolioCalc();
        return q;
    }

    async function initHistoryChart(code, seq) {
        try {
            const klines = await sdk.getHistoryKline(code, { period: 'daily' });
            if (seq !== fetchSeq) return;
            if (!klines || klines.length === 0) { historyChartBox.style.display = 'none'; return; }

            if (!historyChart) {
                historyChart = echarts.init(document.getElementById('historyChart'), 'dark');
                // 监听窗口大小变化，解决横竖屏切换时的尺寸问题
                window.addEventListener('resize', () => historyChart?.resize());
                // 监听设备旋转事件，专门针对手机
                window.addEventListener('orientationchange', () => setTimeout(() => historyChart?.resize(), 200));
            }

            const dates = klines.map(k => k.date);
            const candles = klines.map(k => [k.open, k.close, k.low, k.high]);
            const volumes = klines.map(k => ({
                value: k.volume,
                itemStyle: { color: k.close >= k.open ? '#f85149' : '#3fb950' }
            }));

            // 🌟 核心配置优化：缩减 grid 边距，让图表在手机上横向铺满
            historyChart.setOption({
                backgroundColor: 'transparent',
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                axisPointer: { link: [{ xAxisIndex: 'all' }] },
                grid: [
                    { left: '3%', right: '3%', top: '5%', height: '60%' }, // 左右边距缩小至 3%
                    { left: '3%', right: '3%', top: '75%', height: '15%' } // 减少底部留白
                ],
                xAxis: [
                    { type: 'category', data: dates, gridIndex: 0, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#30363d' } } },
                    { type: 'category', data: dates, gridIndex: 1, axisLabel: { color: '#8b949e', fontSize: 10 }, axisLine: { lineStyle: { color: '#30363d' } } }
                ],
                yAxis: [
                    { type: 'value', gridIndex: 0, scale: true, axisLabel: { color: '#8b949e', fontSize: 10 }, splitLine: { lineStyle: { color: '#21262d' } } },
                    { type: 'value', gridIndex: 1, scale: true, axisLabel: { show: false }, splitLine: { show: false } }
                ],
                dataZoom: [
                    // 🌟 开启双指/滚轮缩放，强制在手机上响应
                    { type: 'inside', xAxisIndex: [0, 1], start: 60, end: 100, zoomOnMouseWheel: true, moveOnMouseMove: true },
                    // 底部滑块变大，方便手机触摸操作
                    { type: 'slider', xAxisIndex: [0, 1], bottom: 0, height: 16, start: 60, end: 100, textStyle: { color: '#8b949e' } }
                ],
                series: [
                    { name: '日K', type: 'candlestick', data: candles, xAxisIndex: 0, yAxisIndex: 0, itemStyle: { color: '#f85149', color0: '#3fb950', borderColor: '#f85149', borderColor0: '#3fb950' } },
                    { name: '成交量', type: 'bar', data: volumes, xAxisIndex: 1, yAxisIndex: 1 }
                ]
            }, true);

            historyChartBox.style.display = 'block';
            setTimeout(() => historyChart?.resize(), 100); // 延迟 resize 确保容器已显示
        } catch (err) {
            if (seq !== fetchSeq) return;
            console.error('历史K线加载失败:', err);
            historyChartBox.style.display = 'none';
        }
    }

    async function refreshTimelineChart(code, seq) {
        try {
            const timeline = await sdk.getTodayTimeline(code);
            if (seq !== fetchSeq) return;
            if (!timeline || !timeline.data || timeline.data.length === 0) { timelineChartBox.style.display = 'none'; return; }

            if (!timelineChart) {
                timelineChart = echarts.init(document.getElementById('timelineChart'), 'dark');
                window.addEventListener('resize', () => timelineChart?.resize());
                window.addEventListener('orientationchange', () => setTimeout(() => timelineChart?.resize(), 200));
            }

            const preClose = timeline.preClose ?? timeline.data[0]?.price ?? null;
            const times = timeline.data.map(d => d.time);
            const prices = timeline.data.map(d => d.price);
            const avgPrices = timeline.data.map(d => d.avgPrice);
            const lastPrice = prices[prices.length - 1];
            const isUp = preClose ? lastPrice >= preClose : true;
            const priceColor = isUp ? '#f85149' : '#3fb950';
            const markLineData = preClose ? [{ yAxis: preClose, lineStyle: { color: '#8b949e', type: 'dashed', width: 1 }, label: { formatter: '昨收', color: '#8b949e', position: 'insideEndTop', fontSize: 10 } }] : [];

            // 🌟 同样缩减 grid，并在手机上启用 inside 缩放
            timelineChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis', axisPointer: { type: 'cross' },
                    formatter: (params) => {
                        const p = params[0]; const d = timeline.data[p.dataIndex];
                        if (!d) return '';
                        return `${d.time}<br/>价：${fmtPrice(d.price)}<br/>均：${fmtPrice(d.avgPrice)}<br/>量：${fmtVolume(d.volume)}`;
                    }
                },
                grid: { left: '3%', right: '3%', top: '8%', bottom: '12%' },
                xAxis: { 
                    type: 'category', data: times, boundaryGap: false, 
                    axisLabel: { color: '#8b949e', fontSize: 10, formatter: (v) => v.slice(0, 5) }, 
                    axisLine: { lineStyle: { color: '#30363d' } } 
                },
                yAxis: { 
                    type: 'value', scale: true, 
                    axisLabel: { color: '#8b949e', fontSize: 10, formatter: (v) => v.toFixed(1) }, 
                    splitLine: { lineStyle: { color: '#21262d' } } 
                },
                dataZoom: [
                    // 分时图也允许缩放，防止横屏时数据过于密集
                    { type: 'inside', xAxisIndex: 0, start: 0, end: 100 }
                ],
                series: [
                    { name: '价格', type: 'line', data: prices, lineStyle: { color: priceColor, width: 1.5 }, showSymbol: false, smooth: true, markLine: { symbol: 'none', data: markLineData } },
                    { name: '均价', type: 'line', data: avgPrices, lineStyle: { color: '#d29922', width: 1, type: 'dotted' }, showSymbol: false, smooth: true }
                ]
            }, true);

            timelineChartBox.style.display = 'block';
            liveIndicator.style.display = 'inline-block';
            setTimeout(() => timelineChart?.resize(), 100);
        } catch (err) {
            if (seq !== fetchSeq) return;
            console.error('分时数据加载失败:', err);
            timelineChartBox.style.display = 'none';
        }
    }

    async function refreshAll(rawCode, showSpinner = true) {
        const seq = ++fetchSeq;
        if (showSpinner) { searchBtn.disabled = true; setStatus('<span class="spinner"></span>正在获取行情...'); }
        const code = normalizeCode(rawCode);
        let quoteOk = false; let quoteErr = null;

        try {
            await fetchQuote(code, seq);
            if (seq !== fetchSeq) return;
            quoteOk = true; currentCode = code;
            renderWatchlist(); loadPortfolioToInputs(code);
        } catch (err) {
            if (seq !== fetchSeq) return;
            quoteErr = err;
        }

        await Promise.all([ initHistoryChart(code, seq), refreshTimelineChart(code, seq) ]);
        if (seq !== fetchSeq) return; 

        if (quoteOk) {
            const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            if (showSpinner) setStatus(`✅ 更新：${now}`);
        } else {
            setStatus(`❌ 获取失败：${quoteErr?.message || '未知错误'}`, true);
        }
        if (showSpinner) searchBtn.disabled = false;
    }

    async function handleQuery() {
        const raw = codeInput.value.trim();
        if (!raw) { setStatus('请输入代码', true); return; }
        hideSuggestions(); stopAutoRefresh(); searchBtn.disabled = true;
        setStatus('<span class="spinner"></span>搜索中...');

        try {
            const results = await searchStocks(raw);
            if (results.length === 0) { await refreshAll(raw); }
            else if (results.length === 1) { const target = results[0]; codeInput.value = target.name; await refreshAll(target.code); }
            else { renderSuggestions(results); setStatus(`找到 ${results.length} 个结果`); searchBtn.disabled = false; return; }
            startAutoRefresh();
        } catch (err) {
            setStatus(`❌ 失败：${err.message || '网络错误'}`, true);
        } finally {
            searchBtn.disabled = false;
        }
    }

    function startAutoRefresh() {
        stopAutoRefresh();
        liveIndicator.style.display = 'inline-block';
        refreshTimer = setInterval(async () => {
            if (document.visibilityState !== 'visible') return;
            await refreshAll(currentCode, false);
        }, currentInterval);
    }
    function stopAutoRefresh() {
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        liveIndicator.style.display = 'none';
    }

    searchBtn.addEventListener('click', handleQuery);
    codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleQuery(); });
    starBtn.addEventListener('click', () => { if (currentCode) toggleWatchlist(currentCode, currentStockName); });
    refreshRateSelect.addEventListener('change', (e) => {
        currentInterval = parseInt(e.target.value, 10);
        if (refreshTimer) startAutoRefresh();
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('.search-bar')) hideSuggestions(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !refreshTimer) startAutoRefresh(); });

    (async function init() {
        renderWatchlist();
        await refreshAll('sh600519');
        startAutoRefresh();
    })();
</script>
